<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회계학 데일리 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 매일 한 세트씩 끝내는 실전 연습장, 경쾌하지만 지문은 시험지처럼 또렷하게
   IDEA: 오늘의 시험지 한 장 — 20칸 답안 체크 띠가 채워지는 일일 세트
   PICTURE: 홈 상단의 오늘 세트 카드(20칸 진행 띠, 점수, 시작 버튼)와 지난 7일 점수 막대
   COLOUR and TYPE: 코발트 주색, 해바라기 노랑 보상, 정답 초록·오답 빨강은 채점 전용 / Jua 제목 + Noto Sans KR 본문, 표는 고정폭 숫자
   LAYOUT: 상단 통계줄, 가운데 한 열(최대 720px), 풀이 화면은 진행바-지문(표)-보기-하단 고정 버튼 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1620);--ink:light-dark(#1d232b,#eef2f7);--mut:light-dark(#6b7480,#9aa6b4);
--line:light-dark(#e3e7ee,#28323f);--card:light-dark(#f6f8fb,#17212d);--paper:light-dark(#fffdf6,#141c26);
--pri:light-dark(#1f63e0,#4f8cff);--priD:light-dark(#1647a6,#2f63c9);--priBg:light-dark(#e8efff,#16264a);
--gold:#ffb703;--goldD:#d18e00;--ok:light-dark(#22a447,#3ccf62);--okD:light-dark(#17803a,#26a04a);--okBg:light-dark(#dff6e5,#123322);
--bad:light-dark(#e2414b,#ff6670);--badD:light-dark(#b42830,#c9434b);--badBg:light-dark(#ffe3e5,#3a1619)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.jua{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ico{width:22px;height:22px;flex:none}
.stats{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.stats .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;height:60px}
.stat{display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px;white-space:nowrap}
.stat.fire{color:#ff8a00}.stat.xp{color:var(--gold)}.stat.goal{color:var(--pri)}
.hero{padding:24px 0 6px}
.hero h1{font-size:clamp(32px,7vw,44px);line-height:1.05;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--mut)}
.today{margin:18px 0 0;border:2px solid var(--line);border-bottom-width:6px;border-radius:22px;padding:20px;background:var(--paper)}
.today .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.today h2{margin:0;font-size:clamp(24px,5vw,30px);line-height:1.1}
.today .date{color:var(--mut);font-weight:700;font-size:14px}
.cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:16px 0 14px}
.cell{aspect-ratio:1;border-radius:8px;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--mut)}
.cell.ok{background:var(--ok);color:#fff}.cell.ng{background:var(--bad);color:#fff}.cell.c{box-shadow:inset 0 0 0 3px var(--gold)}
.mix{color:var(--mut);font-size:14px;margin:0 0 14px}
.go{width:100%;border:0;border-radius:16px;padding:14px;font-size:18px;font-weight:900;background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--priD);min-height:52px}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--priD)}
.go:disabled{background:var(--line);color:var(--mut);box-shadow:0 5px 0 light-dark(#cfd5de,#1c2530);cursor:default;transform:none}
.go.ghost{background:var(--bg);color:var(--pri);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.sec{margin:30px 0 0}.sec h3{font-size:22px;margin:0 0 10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px;background:var(--card);border-radius:18px;padding:14px 12px 10px}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--mut)}
.wk i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--pri);min-height:3px}
.wk b{color:var(--ink);font-size:13px}
.weak li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.weak ul{list-style:none;margin:0;padding:0}.weak .pc{font-weight:900;white-space:nowrap}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.note{color:var(--mut);font-size:13px;margin:30px 0 0;text-align:center}
.reset{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;padding:10px 0 50px;display:block;margin:0 auto;min-height:44px}
.ltop{display:flex;align-items:center;gap:14px;padding:16px 0}
.x{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;color:var(--mut);margin-left:-10px;flex:none}
.cnt{font-weight:900;color:var(--mut);white-space:nowrap}
.qbody{padding:4px 0 250px}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--pri);background:var(--priBg);border-radius:8px;padding:2px 10px;margin:0 4px 8px 0}
.tag.c{color:#b45309;background:light-dark(#fff1de,#3a2810)}
.paper{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin:0 0 18px;font-size:16.5px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.paper p{margin:0 0 10px}
.paper ul{margin:0 0 10px;padding-left:20px}.paper li{margin:3px 0}
.paper .qq{font-weight:900;margin:12px 0 0}
.tbl{overflow-x:auto;margin:4px 0 12px}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:right;white-space:nowrap}
.tbl th{background:var(--card);text-align:center;font-weight:700}
.tbl td:first-child{text-align:left}
.chips{display:flex;flex-direction:column;gap:9px}
.chip{border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--bg);padding:11px 14px;font-size:16px;font-weight:500;text-align:left;min-height:50px;display:flex;gap:12px;align-items:center;word-break:keep-all;overflow-wrap:anywhere}
.chip.num{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.chip kbd{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font:700 13px "Noto Sans KR";color:var(--mut)}
.chip:active{border-bottom-width:2px;transform:translateY(3px)}
.chip.sel{border-color:var(--pri);background:var(--priBg);color:var(--pri)}
.chip.right{border-color:var(--ok);background:var(--okBg);color:inherit}.chip.wrong{border-color:var(--bad);background:var(--badBg);color:inherit}
.foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:var(--bg);z-index:6}
.foot .wrap{padding-top:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.foot.ok{background:var(--okBg);border-color:transparent}.foot.bad{background:var(--badBg);border-color:transparent}
.res{display:none;margin-bottom:12px;max-height:48vh;overflow:auto}
.foot.ok .res,.foot.bad .res{display:block;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.res h3{font-size:25px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.foot.ok h3{color:var(--okD)}.foot.bad h3{color:var(--badD)}
.res .ans{font-weight:900;margin:0 0 6px}
.res ol{margin:0;padding-left:20px;font-size:15px}.res li{margin:2px 0}
.res p{margin:0;font-size:15px}
.foot.ok .go{background:var(--ok);box-shadow:0 5px 0 var(--okD)}.foot.bad .go{background:var(--bad);box-shadow:0 5px 0 var(--badD)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.end{padding:30px 0 50px;text-align:center}
.end h1{font-size:clamp(34px,8vw,48px);margin:10px 0 4px;line-height:1.05}
.end>p{color:var(--mut);margin:0 0 20px}
.big{font-family:Jua;font-size:clamp(64px,16vw,96px);line-height:1;color:var(--pri)}
.big small{font-size:.4em;color:var(--mut)}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 22px}
.box{border:2px solid var(--c);border-radius:16px;overflow:hidden}
.box div{background:var(--c);color:#fff;font-weight:900;font-size:13px;padding:4px}
.box b{display:block;font-size:22px;padding:10px 0;color:var(--c)}
.rev{text-align:left;margin:0 0 18px}
.rev details{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.rev summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
.rev summary::-webkit-details-marker{display:none}
.rev .mk{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;background:var(--bad)}
.rev .mk.o{background:var(--ok)}
.rev .body{margin-top:10px;font-size:15px}
@media(max-width:420px){.stats .wrap{gap:8px}.stat{font-size:15px}.cells{gap:4px}.paper{padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-fire" viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 2.5s.8 3.3-1.6 6c-1.6 1.8-3.4-.4-3.4-.4S5 11 5 15a7 7 0 0 0 14 0c0-5.6-5.5-7.8-5.5-12.5zM12 20a3 3 0 0 1-3-3c0-2 2-3 2-4.6 0 0 4 1.6 4 4.6a3 3 0 0 1-3 3z"/></symbol>
 <symbol id="i-bolt" viewBox="0 0 24 24"><path fill="currentColor" d="M13.6 1.8 4.5 13.2c-.4.5 0 1.3.6 1.3H11l-1.4 7.7c-.1.6.7 1 1.1.5l9.1-11.4c.4-.5 0-1.3-.6-1.3H13l1.6-7.7c.1-.6-.7-1-1-.5z"/></symbol>
 <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="12" cy="12" r="4.5" fill="currentColor"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="m7 12.5 3.2 3.2L17.5 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
 <symbol id="i-no" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="3" stroke-linecap="round"/></symbol>
</svg>
<script>
/* 계산문제 생성기: 각 생성기는 난수(R)를 받아 자료·질문·정답·함정 보기·풀이를 돌려준다. */
const CO=['(주)감평','(주)대한','(주)민국','(주)한국','(주)세무','(주)관세'];
const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');
const num=n=>Math.round(n).toLocaleString('ko-KR');
const r4=x=>Math.round(x*10000)/10000;
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1);if(c<0xac00||c>0xd7a3)return w+a;return w+((c-0xac00)%28?a:b)};
// josa(name,'은','는') : 받침 있으면 a
const eun=w=>josa(w,'은','는'),eui=w=>w+'의',iga=w=>josa(w,'이','가');
const pvf=(i,n)=>r4(1/Math.pow(1+i/100,n)),anf=(i,n)=>r4((1-1/Math.pow(1+i/100,n))/(i/100));
function mkR(seed){let s=seed>>>0;const f=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const R={f,int:(a,b)=>a+Math.floor(f()*(b-a+1)),pick:a=>a[Math.floor(f()*a.length)],chance:p=>f()<p,shuf:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}};return R}
const isInt=x=>Math.abs(x-Math.round(x))<1e-9;
function tries(R,fn){for(let k=0;k<400;k++){const v=fn();if(v)return v}throw new Error('gen failed')}

const GENS=[
/* ───────── 재무회계 ───────── */
{id:'inv_adj',p:'재무회계',t:'재고자산',f:R=>{const c=R.pick(CO);
  const S=R.int(18,35)*100000,A=R.int(2,6)*50000,B=R.int(2,6)*50000,C=R.int(2,8)*100000,p=R.pick([20,40,50,60,80]),D=R.int(2,6)*100000,q=R.pick([25,50,75]),E=R.int(1,4)*50000,F=R.int(2,5)*50000;
  const cons=C*(100-p)/100,trial=D*(100-q)/100,ans=S+A+cons+trial-E;
  return{s:{intro:`${eun(c)} 20X1년 말 창고에 있는 상품을 실사한 결과 ${won(S)}으로 확인되었다. 다음은 기말재고와 관련된 추가 자료이다.`,lines:[
   `20X1년 12월 27일 선적지인도조건으로 매입한 상품(원가 ${won(A)})이 기말 현재 운송 중이다.`,
   `20X1년 12월 29일 도착지인도조건으로 매입한 상품(원가 ${won(B)})이 기말 현재 운송 중이다.`,
   `수탁자에게 적송한 상품(원가 ${won(C)}) 중 ${p}%가 기말까지 판매되었다.`,
   `고객에게 인도한 시송품(원가 ${won(D)}) 중 ${q}%에 대해 기말까지 매입의사표시를 받았다.`,
   `위탁자로부터 판매를 수탁받은 상품(원가 ${won(E)})이 창고에 보관되어 있으며 실사금액에 포함되어 있다.`,
   `20X1년 12월 30일 선적지인도조건으로 판매한 상품(원가 ${won(F)})이 기말 현재 운송 중이다.`],
   q:`${eui(c)} 20X1년 말 재무상태표에 보고할 기말재고자산은?`},
   ans,wrong:[ans+B,ans+E,ans+C*p/100,ans-cons,ans+F,ans-A],u:'won',
   e:[`선적지인도조건 매입 운송분은 포함(+${won(A)}), 도착지인도조건 매입 운송분은 제외`,`미판매 적송품 ${won(C)} × ${100-p}% = ${won(cons)} 가산`,`매입의사 미표시 시송품 ${won(D)} × ${100-q}% = ${won(trial)} 가산`,`수탁상품은 위탁자 재고이므로 차감(−${won(E)}), 선적지인도조건 판매 운송분은 이미 소유권 이전`,`기말재고 = ${won(S)} + ${won(A)} + ${won(cons)} + ${won(trial)} − ${won(E)} = ${won(ans)}`]}}},

{id:'inv_flow',p:'재무회계',t:'재고자산',f:R=>tries(R,()=>{const c=R.pick(CO);
  const q0=R.int(5,15)*10,p0=R.int(8,15)*10,n1=R.int(10,25)*10,p1=p0+R.int(1,4)*10,n2=R.int(10,25)*10,p2=p1+R.int(1,4)*10;
  const s1=R.int(5,Math.floor((q0+n1)/10)-1)*10,s2=R.int(5,20)*10,Qe=q0+n1+n2-s1-s2;if(Qe<=0||Qe>=n2+q0)return null;
  const tot=q0*p0+n1*p1+n2*p2,tq=q0+n1+n2,avg=tot/tq;if(!isInt(avg))return null;
  // FIFO ending: from latest
  let rem=Qe,fifoEnd=0;for(const [qq,pp] of [[n2,p2],[n1,p1],[q0,p0]]){const t=Math.min(rem,qq);fifoEnd+=t*pp;rem-=t}
  const lifoEnd=(()=>{let r=Qe,v=0;for(const [qq,pp] of [[q0,p0],[n1,p1],[n2,p2]]){const t=Math.min(r,qq);v+=t*pp;r-=t}return v})();
  const avgEnd=Qe*avg,v=R.pick(['fifo_cogs','avg_end','fifo_end','avg_cogs']);
  const map={fifo_cogs:[tot-fifoEnd,'선입선출법을 적용할 경우 20X1년 매출원가는?'],avg_end:[avgEnd,'총평균법(실지재고조사법)을 적용할 경우 20X1년 말 재고자산은?'],fifo_end:[fifoEnd,'선입선출법을 적용할 경우 20X1년 말 재고자산은?'],avg_cogs:[tot-avgEnd,'총평균법(실지재고조사법)을 적용할 경우 20X1년 매출원가는?']};
  const [ans,qs]=map[v];const isEnd=v.endsWith('end');
  const alt=isEnd?[v.startsWith('fifo')?avgEnd:fifoEnd,lifoEnd,tot-ans,v.startsWith('fifo')?fifoEnd-(n2>Qe?0:0)+ (p2-p1)*10:avgEnd+ (p2-p0)*10]:[v.startsWith('fifo')?tot-avgEnd:tot-fifoEnd,tot-lifoEnd,tot-ans];
  return{s:{intro:`${eui(c)} 20X1년 상품 관련 자료는 다음과 같다.`,table:{h:['일자','내역','수량','단가'],r:[['1/1','기초재고',num(q0)+'개',won(p0)],['3/1','매입',num(n1)+'개',won(p1)],['5/10','판매',num(s1)+'개',''],['9/1','매입',num(n2)+'개',won(p2)],['11/20','판매',num(s2)+'개','']]},q:`재고자산 감모와 평가손실은 없다. ${qs}`},
  ans,wrong:alt,u:'won',e:[`판매가능상품 원가 = ${won(tot)} (총 ${num(tq)}개), 기말 수량 = ${num(Qe)}개`,v.startsWith('fifo')?`선입선출법: 기말재고는 가장 나중에 매입한 것부터 구성 → ${won(fifoEnd)}`:`총평균단가 = ${won(tot)} ÷ ${num(tq)}개 = ${won(avg)}, 기말재고 = ${num(Qe)}개 × ${won(avg)} = ${won(avgEnd)}`,isEnd?`답: ${won(ans)}`:`매출원가 = ${won(tot)} − ${won(tot-ans)} = ${won(ans)}`]}})},

{id:'lcm',p:'재무회계',t:'재고자산',f:R=>tries(R,()=>{const c=R.pick(CO);
  const uc=R.int(8,20)*100,Qb=R.int(80,150)*10,l=R.int(2,8)*10,Qa=Qb-l,nrv=uc-R.int(1,4)*100,np=R.pick([40,50,60,80]);
  const G=Qb*uc+R.int(20,50)*100000,shr=l*uc,val=Qa*(uc-nrv),ans=G-Qb*uc+shr*np/100+val;if(!isInt(shr*np/100))return null;
  return{s:{intro:`${eui(c)} 20X1년 재고자산 관련 자료는 다음과 같다.`,lines:[`판매가능상품원가(기초재고 + 당기매입): ${won(G)}`,`기말 장부수량 ${num(Qb)}개, 실사수량 ${num(Qa)}개`,`단위당 취득원가 ${won(uc)}, 단위당 순실현가능가치 ${won(nrv)}`,`재고자산감모손실 중 ${np}%는 정상감모(매출원가 처리), 나머지는 비정상감모(기타비용 처리)이다.`,`재고자산평가손실은 매출원가에 포함한다.`],q:`${eui(c)} 20X1년 포괄손익계산서에 보고할 매출원가는?`},
  ans,wrong:[G-Qa*nrv,G-Qb*uc,G-Qb*uc+shr,G-Qb*uc+val,G-Qb*uc+shr*np/100],u:'won',
  e:[`감모손실 = (${num(Qb)} − ${num(Qa)})개 × ${won(uc)} = ${won(shr)} → 정상분 ${won(shr*np/100)}만 매출원가`,`평가손실 = ${num(Qa)}개 × (${won(uc)} − ${won(nrv)}) = ${won(val)}`,`매출원가 = ${won(G)} − 장부상 기말재고 ${won(Qb*uc)} + ${won(shr*np/100)} + ${won(val)} = ${won(ans)}`]}})},

{id:'gp_method',p:'재무회계',t:'재고자산',f:R=>tries(R,()=>{const c=R.pick(CO);const I0=R.int(10,30)*100000,P=R.int(40,80)*100000,V=R.int(1,5)*100000;
  const markup=R.chance(.5);let rate,cogs,S;
  if(markup){rate=R.pick([20,25,50]);cogs=R.int(40,90)*100000;S=cogs*(100+rate)/100}else{rate=R.pick([20,25,30,40]);S=R.int(50,120)*100000;cogs=S*(100-rate)/100}
  if(!isInt(S)||!isInt(cogs))return null;const est=I0+P-cogs;if(est<=V+100000)return null;const ans=est-V;
  const wc=markup?S*(100-rate)/100:S/(1+rate/100);if(!isInt(wc))return null;
  return{s:{intro:`${eui(c)} 창고에 20X1년 6월 30일 화재가 발생하여 재고자산 일부가 소실되었다. 관련 자료는 다음과 같다.`,lines:[`1월 1일 기초재고 ${won(I0)}`,`1월 1일 ~ 6월 30일 매입액 ${won(P)}, 매출액 ${won(S)}`,markup?`매출원가에 대한 이익률(원가가산율) ${rate}%`:`매출총이익률 ${rate}%`,`화재 후 남아 있는 재고자산의 가치 ${won(V)}`],q:`화재로 인한 재고자산 손실액은?`},
  ans,wrong:[est,I0+P-wc-V,I0+P-wc,ans+V*2>0?ans-V:ans+V],u:'won',
  e:[markup?`매출원가 = ${won(S)} ÷ ${(1+rate/100).toFixed(2)} = ${won(cogs)}`:`매출원가 = ${won(S)} × (1 − ${rate}%) = ${won(cogs)}`,`추정 기말재고 = ${won(I0)} + ${won(P)} − ${won(cogs)} = ${won(est)}`,`손실액 = ${won(est)} − ${won(V)} = ${won(ans)}`]}})},

{id:'dep',p:'재무회계',t:'유형자산',f:R=>tries(R,()=>{const c=R.pick(CO),n=R.pick([4,5]),C=R.int(10,40)*100000,R0=R.int(0,4)*50000,mo=R.pick([1,4,7,10]),used=13-mo;
  const m=R.pick(['syd','ddb','sl']);let ans,x1,wrong,e,q;const sum=n*(n+1)/2;
  if(m==='syd'){const y1=(C-R0)*n/sum,y2=(C-R0)*(n-1)/sum;x1=y1*used/12;ans=y1*(12-used)/12+y2*used/12;wrong=[y2,y1,(C-R0)/n,ans+ (y1-y2)/2];if(![y1,y2,x1,ans].every(isInt))return null;
   e=[`1차년도 상각액 = (${won(C)} − ${won(R0)}) × ${n}/${sum} = ${won(y1)}, 2차년도 = ${won(y2)}`,`20X1년 ${mo}월 취득 → 20X2년에는 1차년도의 ${12-used}개월분과 2차년도의 ${used}개월분이 섞인다`,`20X2년 = ${won(y1)} × ${12-used}/12 + ${won(y2)} × ${used}/12 = ${won(ans)}`];q='연수합계법';}
  else if(m==='ddb'){const rt=2/n;x1=C*rt*used/12;ans=(C-x1)*rt;wrong=[C*rt*(1-rt),(C-R0-x1)*rt,C*rt,(C-x1)/n];if(![x1,ans].every(isInt))return null;
   e=[`상각률 = 2/${n} = ${(rt*100).toFixed(0)}% (이중체감법은 잔존가치를 차감하지 않고 장부금액에 상각률을 곱한다)`,`20X1년 = ${won(C)} × ${(rt*100).toFixed(0)}% × ${used}/12 = ${won(x1)}`,`20X2년 = (${won(C)} − ${won(x1)}) × ${(rt*100).toFixed(0)}% = ${won(ans)}`];q='이중체감법(상각률은 정액법 상각률의 2배)';}
  else{const y=(C-R0)/n;x1=y*used/12;ans=C-x1-y;wrong=[C-2*y,C-x1,C-y,C-R0-x1-y];if(![y,x1].every(isInt))return null;
   e=[`연간 상각액 = (${won(C)} − ${won(R0)}) ÷ ${n}년 = ${won(y)}`,`20X1년 상각액 = ${won(y)} × ${used}/12 = ${won(x1)}`,`20X2년 말 장부금액 = ${won(C)} − ${won(x1)} − ${won(y)} = ${won(ans)}`];q='정액법';}
  return{s:{intro:`${eun(c)} 20X1년 ${mo}월 1일 기계장치를 ${won(C)}에 취득하였다(내용연수 ${n}년, 잔존가치 ${won(R0)}). ${eun(c)} 이 기계장치를 ${q}으로 감가상각하며 원가모형을 적용한다.`,q:m==='sl'?'20X2년 말 기계장치의 장부금액은? (단, 감가상각은 월할계산한다.)':'20X2년도 감가상각비는? (단, 감가상각은 월할계산한다.)'},ans,wrong,u:'won',e}})},

{id:'disposal',p:'재무회계',t:'유형자산',f:R=>tries(R,()=>{const c=R.pick(CO),n=R.pick([5,10]),C=R.int(10,40)*100000,R0=R.int(0,4)*100000,dm=R.pick([4,7,10]);
  const y=(C-R0)/n,mth=24+dm-1,acc=y*mth/12;if(!isInt(acc)||!isInt(y))return null;const BV=C-acc,P=Math.round((BV+R.int(-8,8)*50000)/10000)*10000;const ans=P-BV;if(ans===0)return null;
  return{s:{intro:`${eun(c)} 20X1년 1월 1일 건물을 ${won(C)}에 취득하여 정액법(내용연수 ${n}년, 잔존가치 ${won(R0)})으로 감가상각하여 왔다. 20X3년 ${dm}월 1일 이 건물을 ${won(P)}에 처분하였다.`,q:'건물 처분으로 인식할 유형자산처분손익은? (단, 원가모형을 적용하고 감가상각은 월할계산한다.)'},
   ans,wrong:[P-(C-2*y),P-(C-3*y),-ans,P-(C-R0-acc),P-C+acc+y*(dm-1)/12],u:'pl',lab:['이익','손실'],
   e:[`연간 감가상각비 = (${won(C)} − ${won(R0)}) ÷ ${n} = ${won(y)}`,`처분일까지 ${mth}개월 상각 → 감가상각누계액 ${won(acc)}`,`처분 시 장부금액 = ${won(C)} − ${won(acc)} = ${won(BV)}`,`처분손익 = ${won(P)} − ${won(BV)} = ${won(Math.abs(ans))} ${ans>0?'이익':'손실'}`]}})},

{id:'reval',p:'재무회계',t:'유형자산',f:R=>{const c=R.pick(CO),C=R.int(10,30)*100000,u=R.int(1,5)*100000,d=R.int(1,5)*100000,up=R.chance(.5),askOci=R.chance(.35);
  let ans,wrong,e,FV1,FV2;
  if(up){FV1=C+u;FV2=C-d;ans=askOci?-u:-d;wrong=askOci?[-(u+d),u,-d,0]:[-(u+d),-u,0,d];e=[`20X1년 말: 재평가잉여금(기타포괄이익) ${won(u)} 인식`,`20X2년 말: 장부금액 ${won(FV1)} → ${won(FV2)} 감소액 ${won(u+d)} 중 ${won(u)}은 재평가잉여금과 먼저 상계(기타포괄손익 감소), 나머지 ${won(d)}은 재평가손실(당기손익)`,askOci?`기타포괄손익 ${won(u)} 감소`:`당기순이익 ${won(d)} 감소`]}
  else{FV1=C-d;FV2=C+u;ans=askOci?u:d;wrong=askOci?[u+d,d,0,-u]:[u+d,u,0,-d];e=[`20X1년 말: 재평가손실(당기손익) ${won(d)} 인식`,`20X2년 말: 증가액 ${won(u+d)} 중 과거 당기손실로 인식한 ${won(d)}까지는 재평가이익(당기손익), 초과분 ${won(u)}은 재평가잉여금(기타포괄이익)`,askOci?`기타포괄이익 ${won(u)} 증가`:`당기순이익 ${won(d)} 증가`]}
  return{s:{intro:`${eun(c)} 20X1년 초 토지를 ${won(C)}에 취득하고 재평가모형을 적용하고 있다. 토지의 공정가치는 다음과 같다.`,table:{h:['구분','20X1년 말','20X2년 말'],r:[['공정가치',won(FV1),won(FV2)]]},q:`토지와 관련하여 ${eui(c)} 20X2년도 ${askOci?'기타포괄손익':'당기순이익'}에 미치는 영향은? (단, 재평가잉여금은 이익잉여금으로 대체하지 않는다.)`},ans,wrong,u:'pl',lab:['증가','감소'],e}}},

{id:'impair',p:'재무회계',t:'유형자산',f:R=>tries(R,()=>{const c=R.pick(CO),n=R.pick([5,8,10]),C=R.int(10,40)*100000,y=C/n;if(!isInt(y))return null;
  const BV=C-2*y,A=BV-R.int(2,8)*100000,B=BV-R.int(2,8)*100000;if(A===B||Math.min(A,B)<=0)return null;const rec=Math.max(A,B),ask3=R.chance(.4);
  const loss=BV-rec,d3=rec/(n-2);if(ask3&&!isInt(d3))return null;const ans=ask3?d3:loss;
  return{s:{intro:`${eun(c)} 20X1년 1월 1일 기계장치를 ${won(C)}에 취득하여 정액법(내용연수 ${n}년, 잔존가치 없음)으로 감가상각하고 원가모형을 적용한다. 20X2년 말 손상징후가 있어 손상검사를 한 결과는 다음과 같다.`,lines:[`순공정가치(공정가치 − 처분부대원가) ${won(A)}`,`사용가치 ${won(B)}`],q:ask3?'20X3년도 감가상각비는? (단, 20X3년 중 추가 손상이나 회복은 없다.)':'20X2년 말 인식할 손상차손은?'},
   ans,wrong:ask3?[y,Math.min(A,B)/(n-2),BV/(n-2),rec/n]:[BV-Math.min(A,B),C-rec,BV-A,BV-B,y],u:'won',
   e:[`20X2년 말 장부금액 = ${won(C)} − ${won(y)} × 2 = ${won(BV)}`,`회수가능액 = max(순공정가치, 사용가치) = ${won(rec)}`,ask3?`손상 후 장부금액 ${won(rec)}을 잔여 내용연수 ${n-2}년에 걸쳐 상각 → ${won(d3)}`:`손상차손 = ${won(BV)} − ${won(rec)} = ${won(loss)}`]}})},

{id:'borrow',p:'재무회계',t:'차입원가',f:R=>tries(R,()=>{const c=R.pick(CO),E1=R.int(30,60)*100000,m2=R.pick([4,7,10]),E2=R.int(20,60)*100000,S=R.int(10,25)*100000,r1=R.pick([5,6,8]);
  const G1=R.int(10,40)*100000,r2=R.pick([6,8,10]),G2=R.int(10,40)*100000,r3=R.pick([4,5,12]);const mo2=13-m2,avgE=E1+E2*mo2/12;
  const gi=G1*r2/100+G2*r3/100,cr=gi/(G1+G2);if(!isInt(cr*1000*100))return null;const sp=S*r1/100,gen=Math.min((avgE-S)*cr,gi);if(!isInt(gen)||!isInt(avgE))return null;const ans=sp+gen;
  return{s:{intro:`${eun(c)} 20X1년 1월 1일 공장 건물 신축공사를 시작하여 20X2년 말 완공할 예정이다(적격자산). 관련 자료는 다음과 같다.`,lines:[`공사비 지출: 20X1년 1월 1일 ${won(E1)}, 20X1년 ${m2}월 1일 ${won(E2)}`,`특정차입금: ${won(S)} (20X1.1.1 ~ 20X2.12.31, 연 ${r1}%), 일시 투자수익은 없다.`,`일반차입금 A: ${won(G1)} (20X1년 전기간, 연 ${r2}%)`,`일반차입금 B: ${won(G2)} (20X1년 전기간, 연 ${r3}%)`],q:`${iga(c)} 20X1년도에 자본화할 차입원가는? (단, 이자는 월할계산한다.)`},
   ans,wrong:[sp+(avgE-S)*(r2+r3)/200,sp+avgE*cr,gen,sp+gi,sp+(E1+E2-S)*cr],u:'won',
   e:[`연평균지출액 = ${won(E1)} + ${won(E2)} × ${mo2}/12 = ${won(avgE)}`,`특정차입금 자본화 = ${won(S)} × ${r1}% = ${won(sp)}`,`자본화이자율 = (${won(G1*r2/100)} + ${won(G2*r3/100)}) ÷ ${won(G1+G2)} = ${(cr*100).toFixed(2).replace(/\.?0+$/,'')}%`,`일반차입금 자본화 = min[(${won(avgE)} − ${won(S)}) × 자본화이자율, 실제 이자 ${won(gi)}] = ${won(gen)}`,`합계 = ${won(ans)}`]}})},

{id:'aro',p:'재무회계',t:'충당부채',f:R=>tries(R,()=>{const c=R.pick(CO),i=R.pick([8,10]),n=5,f=pvf(i,n),C=R.int(20,50)*100000,D=R.int(2,8)*100000;
  const PV=Math.round(D*f),cost=C+PV,dep=Math.round(cost/n),int=Math.round(PV*i/100),ans=dep+int;
  return{s:{intro:`${eun(c)} 20X1년 1월 1일 해양구조물을 ${won(C)}에 취득하였다(내용연수 ${n}년, 잔존가치 없음, 정액법). 이 구조물은 내용연수 종료 시 원상복구 의무가 있으며 복구예상금액은 ${won(D)}이다.`,lines:[`복구충당부채 할인율 연 ${i}%`,`단일금액 ₩1의 현재가치(${n}기간, ${i}%) = ${f.toFixed(4)}`],q:`해양구조물과 관련하여 ${iga(c)} 20X1년도에 비용으로 인식할 총금액은? (단, 원가모형을 적용한다.)`},
   ans,wrong:[dep,Math.round(C/n),Math.round(C/n)+int,Math.round((C+D)/n),Math.round(C/n)+Math.round(D/n)],u:'won',
   e:[`복구충당부채 = ${won(D)} × ${f.toFixed(4)} = ${won(PV)} → 자산 원가에 가산`,`취득원가 = ${won(C)} + ${won(PV)} = ${won(cost)}, 감가상각비 = ${won(cost)} ÷ ${n} = ${won(dep)}`,`이자비용(복구충당부채 전입) = ${won(PV)} × ${i}% = ${won(int)}`,`총비용 = ${won(dep)} + ${won(int)} = ${won(ans)}`]}})},

{id:'bond',p:'재무회계',t:'금융부채·사채',f:R=>{const c=R.pick(CO),F=R.pick([1,2,3,5])*1000000,cr=R.pick([5,6,8]),m=cr+R.pick([2,3,4]),pv=pvf(m,3),an=anf(m,3);
  const P=Math.round(F*pv+F*cr/100*an),I1=Math.round(P*m/100),BV1=P+I1-F*cr/100,I2=Math.round(BV1*m/100),askBV=R.chance(.4);const ans=askBV?BV1:I2;
  return{s:{intro:`${eun(c)} 20X1년 1월 1일 액면금액 ${won(F)}, 표시이자율 연 ${cr}%(매년 말 지급), 만기 3년의 사채를 발행하였다. 발행일의 시장이자율은 연 ${m}%이며 현재가치계수는 다음과 같다.`,table:{h:['구분(3기간, '+m+'%)','현재가치계수'],r:[['단일금액 ₩1',pv.toFixed(4)],['정상연금 ₩1',an.toFixed(4)]]},q:askBV?'20X1년 말 사채의 장부금액은? (단, 유효이자율법을 적용하고 원 미만은 반올림한다.)':'20X2년도에 인식할 이자비용은? (단, 유효이자율법을 적용하고 원 미만은 반올림한다.)'},
   ans,wrong:askBV?[P,F,P+I1,BV1+(F*cr/100)]:[I1,F*cr/100,F*m/100,Math.round((F-P)/3+F*cr/100)],u:'won',
   e:[`발행금액 = ${won(F)} × ${pv.toFixed(4)} + ${won(F*cr/100)} × ${an.toFixed(4)} = ${won(P)}`,`20X1년 이자비용 = ${won(P)} × ${m}% = ${won(I1)}`,`20X1년 말 장부금액 = ${won(P)} + (${won(I1)} − ${won(F*cr/100)}) = ${won(BV1)}`,...(askBV?[]:[`20X2년 이자비용 = ${won(BV1)} × ${m}% = ${won(I2)}`])]}}},

{id:'equity',p:'재무회계',t:'관계기업',f:R=>tries(R,()=>{const c=R.pick(CO),b='(주)'+R.pick(['서울','부산','광주','대전']),p=R.pick([20,25,30,40]),N=R.int(10,30)*100000,X=R.int(1,5)*100000,n=R.pick([5,10]);
  const K=(N+X)*p/100+R.int(0,4)*10000,NI=R.int(2,8)*100000,D=R.int(1,4)*50000,O=R.int(1,4)*50000;const adj=(NI-X/n)*p/100,ans=K+adj+O*p/100-D*p/100;if(![adj,ans,X/n].every(isInt))return null;
  return{s:{intro:`${eun(c)} 20X1년 초 ${b}의 의결권 있는 주식 ${p}%를 ${won(K)}에 취득하여 유의적인 영향력을 행사하게 되었다. 취득일 ${b}의 순자산 장부금액은 ${won(N)}이며, 건물(잔존내용연수 ${n}년, 정액법)의 공정가치가 장부금액보다 ${won(X)} 높은 것 외에는 장부금액과 공정가치가 같다.`,lines:[`${b}의 20X1년 당기순이익 ${won(NI)}, 기타포괄이익 ${won(O)}`,`${eun(b)} 20X1년 중 현금배당 ${won(D)}을 지급하였다.`],q:`${eui(c)} 20X1년 말 관계기업투자주식 장부금액은?`},
   ans,wrong:[K+NI*p/100+O*p/100-D*p/100,K+adj-D*p/100,K+adj+O*p/100,K+adj+O*p/100+D*p/100,K+NI*p/100],u:'won',
   e:[`지분법이익 = (${won(NI)} − 건물 추가상각 ${won(X/n)}) × ${p}% = ${won(adj)}`,`지분법자본변동 = ${won(O)} × ${p}% = ${won(O*p/100)}`,`배당금 수령 = ${won(D)} × ${p}% = ${won(D*p/100)} (투자주식 장부금액 감소)`,`기말 장부금액 = ${won(K)} + ${won(adj)} + ${won(O*p/100)} − ${won(D*p/100)} = ${won(ans)}`]}})},

{id:'lease',p:'재무회계',t:'리스',f:R=>{const c=R.pick(CO),L=R.int(2,8)*100000,i=R.pick([8,10,12]),an=anf(i,3),d=R.pick([0,20000,30000,50000]),life=R.pick([4,5]);
  const liab=Math.round(L*an),rou=liab+d,dep=Math.round(rou/3),int=Math.round(liab*i/100),ans=dep+int;
  return{s:{intro:`${eun(c)} 20X1년 1월 1일 기계장치 리스계약을 체결하였다(리스이용자). 리스 관련 자료는 다음과 같다.`,lines:[`리스기간 3년, 고정리스료 매년 말 ${won(L)} 지급`,`리스 내재이자율 연 ${i}% (3기간 정상연금 ₩1의 현재가치 ${an.toFixed(4)})`,`리스개설직접원가 ${won(d)}`,`기계장치의 내용연수 ${life}년, 잔존가치 없음, 정액법 상각`,`리스기간 종료 시 소유권 이전이나 매수선택권은 없다.`],q:`${iga(c)} 20X1년도에 인식할 비용 총액은? (단, 원 미만은 반올림한다.)`},
  ans,wrong:[Math.round(rou/life)+int,L,dep+Math.round(rou*i/100),Math.round(liab/3)+int,Math.round(rou/life)+Math.round(rou*i/100)],u:'won',
  e:[`리스부채 = ${won(L)} × ${an.toFixed(4)} = ${won(liab)}`,`사용권자산 = ${won(liab)} + 리스개설직접원가 ${won(d)} = ${won(rou)}`,`소유권 이전이 없으므로 리스기간(3년)과 내용연수 중 짧은 기간으로 상각 → ${won(rou)} ÷ 3 = ${won(dep)}`,`이자비용 = ${won(liab)} × ${i}% = ${won(int)}`,`비용 총액 = ${won(dep)} + ${won(int)} = ${won(ans)}`]}}},

{id:'install',p:'재무회계',t:'수익',f:R=>{const c=R.pick(CO),L=R.int(2,8)*1000000,i=R.pick([8,10,12]),an=anf(i,3),Cst=Math.round(L*an*R.pick([0.6,0.7,0.8])/100000)*100000;
  const S=Math.round(L*an),int=Math.round(S*i/100),ans=S-Cst+int;
  return{s:{intro:`${eun(c)} 20X1년 1월 1일 원가 ${won(Cst)}의 상품을 할부로 판매하고 인도하였다. 대금은 20X1년부터 매년 말 ${won(L)}씩 3회 받는다. 판매일의 유효이자율은 연 ${i}%이며 3기간 정상연금 ₩1의 현재가치는 ${an.toFixed(4)}이다.`,q:`이 할부판매가 ${eui(c)} 20X1년도 당기순이익에 미치는 영향은? (단, 원 미만은 반올림한다.)`},
  ans,wrong:[L*3-Cst,S-Cst,L-Cst+int,S-Cst+Math.round(L*i/100)],u:'pl',lab:['증가','감소'],
  e:[`매출(현재가치) = ${won(L)} × ${an.toFixed(4)} = ${won(S)}`,`매출총이익 = ${won(S)} − ${won(Cst)} = ${won(S-Cst)}`,`이자수익 = ${won(S)} × ${i}% = ${won(int)}`,`당기순이익 증가 = ${won(S-Cst)} + ${won(int)} = ${won(ans)}`]}}},

{id:'points',p:'재무회계',t:'수익',f:R=>tries(R,()=>{const c=R.pick(CO),kk=R.int(4,19),sp=(kk+1)*R.int(1,5)*1000,S=sp*kk,rr=R.pick([50,60,75,80,90]),P=sp*100/rr,k=R.pick([25,40,50,60])/100;
  if(!isInt(P))return null;const alloc=S*sp/(S+sp);if(!isInt(alloc)||!isInt(sp))return null;const red=sp*k,rec=alloc*k;if(!isInt(rec))return null;const ans=S-alloc+rec;
  return{s:{intro:`${eun(c)} 20X1년 중 상품을 ${won(S)}에 현금 판매하면서 고객에게 ${num(P)}포인트를 부여하였다. 1포인트는 향후 상품 구매 시 ₩1을 할인받을 수 있다.`,lines:[`판매한 상품의 개별 판매가격은 ${won(S)}이다.`,`부여한 포인트 중 ${rr}%가 회수(사용)될 것으로 예상하며, 이 예상은 변하지 않는다.`,`20X1년 중 사용된 포인트는 ${num(red)}포인트이다.`],q:`${iga(c)} 20X1년도에 인식할 수익 총액은?`},
   ans,wrong:[S,S-alloc,S-sp+red,S-alloc+P*k],u:'won',
   e:[`포인트의 개별 판매가격 = ${num(P)}포인트 × ${rr}% × ₩1 = ${won(sp)}`,`포인트 배분액 = ${won(S)} × ${won(sp)}/(${won(S)} + ${won(sp)}) = ${won(alloc)} (계약부채)`,`20X1년 포인트 수익 = ${won(alloc)} × ${num(red)}/${num(sp)} = ${won(rec)}`,`수익 총액 = 상품 ${won(S-alloc)} + 포인트 ${won(rec)} = ${won(ans)}`]}})},

{id:'constr',p:'재무회계',t:'수익',f:R=>tries(R,()=>{const c=R.pick(CO),P=R.int(40,90)*1000000,T1=Math.round(P*R.pick([0.7,0.75,0.8])/1000000)*1000000,p1=R.pick([20,25,30,40]),T2=T1+R.int(-4,6)*1000000,p2=R.pick([50,60,70,75,80]);
  if(T2>=P||T2<=0)return null;const c1=T1*p1/100,c2=T2*p2/100,g1=(P-T1)*p1/100,cum2=(P-T2)*p2/100,ans=cum2-g1;if(![c1,c2,g1,cum2].every(isInt)||ans===0)return null;
  return{s:{intro:`${eun(c)} 20X1년 초 도급금액 ${won(P)}의 공사계약을 체결하였다. 진행률은 발생원가 기준으로 측정하며 관련 자료는 다음과 같다.`,table:{h:['구분','20X1년','20X2년'],r:[['누적발생원가',won(c1),won(c2)],['추가예정원가',won(T1-c1),won(T2-c2)]]},q:`${iga(c)} 20X2년도에 인식할 공사이익(손실)은?`},
   ans,wrong:[cum2,(P-T2)*(p2-p1)/100,(P-T1)*p2/100-g1,g1],u:'pl',lab:['이익','손실'],
   e:[`20X1년 진행률 = ${won(c1)} ÷ ${won(T1)} = ${p1}%, 공사이익 = (${won(P)} − ${won(T1)}) × ${p1}% = ${won(g1)}`,`20X2년 진행률 = ${won(c2)} ÷ ${won(T2)} = ${p2}%, 누적 공사이익 = (${won(P)} − ${won(T2)}) × ${p2}% = ${won(cum2)}`,`20X2년 공사이익 = ${won(cum2)} − ${won(g1)} = ${won(ans)}`]}})},

{id:'db',p:'재무회계',t:'종업원급여',f:R=>tries(R,()=>{const c=R.pick(CO),A=R.int(20,50)*100000,B=A-R.int(2,10)*100000,i=R.pick([5,8,10]),SC=R.int(2,6)*100000,W=R.int(1,4)*100000,K=R.int(2,6)*100000;
  const eA=A+A*i/100+SC-W,eB=B+B*i/100-W+K,A2=eA+R.int(-3,3)*100000,B2=eB+R.int(-3,3)*100000;const oci=(B2-eB)-(A2-eA),cost=SC+(A-B)*i/100,askO=R.chance(.4);
  if(askO&&oci===0)return null;const ans=askO?oci:cost;
  return{s:{intro:`${eun(c)} 확정급여제도를 운영하고 있으며 20X1년도 관련 자료는 다음과 같다.`,lines:[`기초 확정급여채무 ${won(A)}, 기초 사외적립자산 공정가치 ${won(B)}`,`당기근무원가 ${won(SC)}, 할인율 연 ${i}%`,`퇴직급여 지급액(사외적립자산에서 지급, 연말) ${won(W)}`,`사외적립자산 추가 기여금(연말) ${won(K)}`,`기말 확정급여채무 ${won(A2)}, 기말 사외적립자산 공정가치 ${won(B2)}`],q:askO?`확정급여제도와 관련하여 ${eui(c)} 20X1년도 기타포괄손익에 미치는 영향은?`:`${iga(c)} 20X1년도 당기손익으로 인식할 퇴직급여 관련 비용은?`},
   ans,wrong:askO?[-oci,(A2-eA),(B2-eB),oci+(A-B)*i/100]:[SC+A*i/100,SC,SC+(A2-B2)*i/100,cost+W,SC+B*i/100],u:askO?'pl':'won',lab:['증가','감소'],
   e:[`순이자원가 = (${won(A)} − ${won(B)}) × ${i}% = ${won((A-B)*i/100)}`,`당기비용 = 당기근무원가 ${won(SC)} + 순이자원가 = ${won(cost)}`,`확정급여채무 재측정손익 = 기대 ${won(eA)} − 실제 ${won(A2)} = ${won(eA-A2)}`,`사외적립자산 재측정손익 = 실제 ${won(B2)} − 기대 ${won(eB)} = ${won(B2-eB)}`,...(askO?[`기타포괄손익 = ${won(eA-A2)} + ${won(B2-eB)} = ${oci>=0?won(oci)+' 증가':won(-oci)+' 감소'}`]:[])]}})},

{id:'sbp',p:'재무회계',t:'주식기준보상',f:R=>tries(R,()=>{const c=R.pick(CO),N=R.int(50,120),M=R.pick([10,20,50]),v=R.int(3,10)*300,d1=R.int(5,15),d2=d1+R.int(1,10);
  const x1=(N-d1)*M*v/3,cum2=(N-d2)*M*v*2/3,ans=cum2-x1;if(ans<=0||!isInt(x1))return null;
  return{s:{intro:`${eun(c)} 20X1년 1월 1일 종업원 ${N}명에게 3년 근무조건으로 각각 주식선택권 ${M}개를 부여하였다. 부여일의 주식선택권 공정가치는 개당 ${won(v)}이다.`,lines:[`20X1년 말: 가득기간 중 총 ${d1}명이 퇴사할 것으로 추정`,`20X2년 말: 가득기간 중 총 ${d2}명이 퇴사할 것으로 추정`],q:`${iga(c)} 20X2년도에 인식할 주식보상비용은?`},
   ans,wrong:[cum2,(N-d2)*M*v/3,x1,(N-d2)*M*v*2/3-(N-d2)*M*v/3+M*v*(d2-d1)],u:'won',
   e:[`20X1년 누적비용 = (${N} − ${d1})명 × ${M}개 × ${won(v)} × 1/3 = ${won(x1)}`,`20X2년 누적비용 = (${N} − ${d2})명 × ${M}개 × ${won(v)} × 2/3 = ${won(cum2)}`,`20X2년 비용 = ${won(cum2)} − ${won(x1)} = ${won(ans)}`]}})},

{id:'tax',p:'재무회계',t:'법인세',f:R=>tries(R,()=>{const c=R.pick(CO),E=R.int(10,50)*100000,a=R.int(1,5)*10000,b=R.int(2,8)*10000,cc=R.int(1,5)*10000,t1=20,t2=R.pick([20,25]),askPay=R.chance(.3);
  const cur=(E+a+b-cc)*t1/100,dta=b*t2/100,dtl=cc*t2/100,exp=cur-dta+dtl,ans=askPay?cur:exp;if(![cur,dta,dtl].every(isInt))return null;
  return{s:{intro:`20X1년 초 설립된 ${eui(c)} 법인세 관련 자료는 다음과 같다.`,lines:[`법인세비용차감전순이익 ${won(E)}`,`접대비 한도초과액(영구적 차이) ${won(a)}`,`감가상각비 한도초과액(20X2년에 전액 소멸되는 일시적 차이) ${won(b)}`,`미수이자(20X2년에 전액 소멸되는 일시적 차이) ${won(cc)}`,`20X1년 법인세율 ${t1}%, 20X2년 이후 법인세율 ${t2}%`,`이연법인세자산의 실현가능성은 높다.`],q:askPay?`${eui(c)} 20X1년 말 미지급법인세(당기법인세부채)는? (단, 중간예납은 없다.)`:`${eui(c)} 20X1년도 법인세비용은?`},
   ans,wrong:askPay?[E*t1/100,(E+a)*t1/100,exp,(E+a+b+cc)*t1/100]:[cur,(E+a)*t1/100,E*t1/100,cur+dta-dtl,(E+a)*t2/100],u:'won',
   e:[`과세소득 = ${won(E)} + ${won(a)} + ${won(b)} − ${won(cc)} = ${won(E+a+b-cc)}, 당기법인세 = × ${t1}% = ${won(cur)}`,`이연법인세자산 = ${won(b)} × ${t2}% = ${won(dta)}, 이연법인세부채 = ${won(cc)} × ${t2}% = ${won(dtl)}`,askPay?`미지급법인세 = 당기법인세 = ${won(cur)}`:`법인세비용 = ${won(cur)} − ${won(dta)} + ${won(dtl)} = ${won(exp)}`]}})},

{id:'eps',p:'재무회계',t:'주당이익',f:R=>tries(R,()=>{const c=R.pick(CO),N0=R.int(5,20)*1200,n1=R.int(1,5)*1200,n2=R.int(1,3)*1200,n3=R.int(1,n2/1200)*600,PD=R.int(1,5)*100000,bonus=R.chance(.35)?R.pick([10,20]):0;
  let WA=N0+n1*9/12-n2*6/12+n3*3/12;if(bonus)WA=(N0+n1*9/12)*(1+bonus/100)-n2*6/12+n3*3/12;if(!isInt(WA))return null;
  const eps=R.int(5,30)*10,NI=eps*WA+PD;
  const WA2=N0+n1*9/12-n2*6/12+n3*3/12;
  return{s:{intro:`${eui(c)} 20X1년 보통주 관련 자료는 다음과 같다.`,lines:[`1월 1일 유통보통주식수 ${num(N0)}주`,`4월 1일 유상증자(공정가치 발행) ${num(n1)}주`,...(bonus?[`5월 1일 무상증자 ${bonus}% (기초 및 4월 1일 유상증자분에 대하여)`]:[]),`7월 1일 자기주식 취득 ${num(n2)}주`,`10월 1일 자기주식 재발행 ${num(n3)}주`,`20X1년 당기순이익 ${won(NI)}, 우선주 배당금 ${won(PD)}`],q:`${eui(c)} 20X1년도 기본주당이익은? (단, 가중평균유통보통주식수는 월할계산한다.)`},
   ans:eps,wrong:[Math.round(NI/WA),Math.round((NI-PD)/(N0+n1*(bonus?1+bonus/100:1)-n2+n3)),bonus?Math.round((NI-PD)/WA2):Math.round((NI-PD)/(N0+n1*9/12)),Math.round((NI-PD)/(WA+n2*6/12))],u:'won',
   e:[bonus?`가중평균유통보통주식수 = (${num(N0)} + ${num(n1)} × 9/12) × ${(1+bonus/100).toFixed(1)} − ${num(n2)} × 6/12 + ${num(n3)} × 3/12 = ${num(WA)}주 (무상증자는 원구주에 따라 소급)`:`가중평균유통보통주식수 = ${num(N0)} + ${num(n1)} × 9/12 − ${num(n2)} × 6/12 + ${num(n3)} × 3/12 = ${num(WA)}주`,`보통주 귀속 이익 = ${won(NI)} − ${won(PD)} = ${won(NI-PD)}`,`기본주당이익 = ${won(NI-PD)} ÷ ${num(WA)}주 = ${won(eps)}`]}})},

{id:'capital',p:'재무회계',t:'자본',f:R=>tries(R,()=>{const c=R.pick(CO),n=R.int(1,5)*100,pi=R.int(12,30)*100,k=R.int(2,6)*10,pb=R.int(12,20)*100,j=R.int(1,k/10)*10-5,pr=pb+R.int(-3,3)*100,D=R.int(1,5)*100000,SD=R.int(1,4)*100000,G=R.int(1,4)*50000,NI=R.int(3,9)*100000;
  if(j<=0)return null;const ans=n*pi-k*pb+j*pr-D+G+NI;
  return{s:{intro:`${eui(c)} 20X1년 중 자본 관련 거래는 다음과 같다. (보통주 주당 액면금액 ₩1,000)`,lines:[`3월 1일: 보통주 ${num(n)}주를 주당 ${won(pi)}에 유상증자`,`4월 1일: 자기주식 ${k}주를 주당 ${won(pb)}에 취득`,`6월 1일: 자기주식 ${j}주를 주당 ${won(pr)}에 재발행`,`8월 1일: 현금배당 ${won(D)} 및 주식배당 ${won(SD)} 지급`,`기타포괄손익-공정가치 측정 지분상품 평가이익 ${won(G)}`,`20X1년 당기순이익 ${won(NI)}`],q:`${eui(c)} 20X1년 자본총계 증가액은?`},
   ans,wrong:[ans+SD,ans-SD,ans-G,ans+D,ans-j*pr],u:'won',
   e:[`유상증자 +${won(n*pi)}, 자기주식 취득 −${won(k*pb)}, 재발행 +${won(j*pr)}`,`현금배당 −${won(D)}, 주식배당은 자본 내부 대체이므로 자본총계 영향 없음`,`기타포괄이익 +${won(G)}, 당기순이익 +${won(NI)}`,`자본총계 증가 = ${won(ans)}`]}})},

{id:'cfo',p:'재무회계',t:'현금흐름표',f:R=>{const c=R.pick(CO),NI=R.int(20,60)*100000,dep=R.int(2,8)*100000,gain=R.int(1,4)*100000;
  const ar0=R.int(10,30)*100000,dAR=R.int(-5,8)*100000,iv0=R.int(10,30)*100000,dI=R.int(-6,6)*100000,ap0=R.int(8,20)*100000,dAP=R.int(-5,6)*100000,ac0=R.int(1,5)*100000,dAc=R.int(-2,3)*100000;
  const ans=NI+dep-gain-dAR-dI+dAP+dAc;
  return{s:{intro:`다음은 ${eui(c)} 20X1년도 현금흐름표 작성을 위한 자료이다.`,lines:[`당기순이익 ${won(NI)}, 감가상각비 ${won(dep)}, 유형자산처분이익 ${won(gain)}`],table:{h:['계정','기초','기말'],r:[['매출채권(순액)',won(ar0),won(ar0+dAR)],['재고자산',won(iv0),won(iv0+dI)],['매입채무',won(ap0),won(ap0+dAP)],['미지급비용',won(ac0),won(ac0+dAc)]]},q:`간접법에 의한 ${eui(c)} 20X1년도 영업활동순현금흐름은?`},
  ans,wrong:[ans+2*gain,ans+2*dAR,ans-2*dAP,ans-dep,ans+2*dI],u:'won',
  e:[`당기순이익 ${won(NI)} + 감가상각비 ${won(dep)} − 처분이익 ${won(gain)}`,`매출채권 ${dAR>=0?'증가':'감소'} ${won(Math.abs(dAR))} ${dAR>=0?'차감':'가산'}, 재고자산 ${dI>=0?'증가':'감소'} ${won(Math.abs(dI))} ${dI>=0?'차감':'가산'}`,`매입채무 ${dAP>=0?'증가':'감소'} ${won(Math.abs(dAP))} ${dAP>=0?'가산':'차감'}, 미지급비용 ${dAc>=0?'증가':'감소'} ${won(Math.abs(dAc))} ${dAc>=0?'가산':'차감'}`,`영업활동순현금흐름 = ${won(ans)}`]}}},

{id:'ecl',p:'재무회계',t:'금융자산',f:R=>tries(R,()=>{const c=R.pick(CO),A=R.int(2,8)*100000,W=R.int(1,6)*100000,Rc=R.int(0,2)*50000,B=R.int(30,90)*1000000,rate=R.pick([1,2,3,5]);
  const E=B*rate/100,ans=E-(A-W+Rc);if(ans<=0)return null;
  return{s:{intro:`${eui(c)} 매출채권 관련 20X1년도 자료는 다음과 같다.`,lines:[`기초 손실충당금 ${won(A)}`,`20X1년 중 회수불능으로 제각한 매출채권 ${won(W)}`,`전기에 제각한 매출채권 중 20X1년 중 현금 회수액 ${won(Rc)}`,`기말 매출채권 ${won(B)}, 기대신용손실률 ${rate}%`],q:`${iga(c)} 20X1년도에 인식할 손상차손(대손상각비)은?`},
   ans,wrong:[E,E-A,E-(A-W),E-(A+Rc),E-(A-W-Rc)],u:'won',
   e:[`기말 손실충당금 = ${won(B)} × ${rate}% = ${won(E)}`,`손상차손 인식 전 잔액 = ${won(A)} − ${won(W)} + ${won(Rc)} = ${won(A-W+Rc)}`,`손상차손 = ${won(E)} − ${won(A-W+Rc)} = ${won(ans)}`]}})},

/* ───────── 원가관리회계 ───────── */
{id:'mfg',p:'원가관리회계',t:'원가회계 기초',f:R=>{const c=R.pick(CO),m0=R.int(2,8)*10000,mp=R.int(20,50)*10000,m1=R.int(2,8)*10000,DL=R.int(15,40)*10000,OH=R.int(10,30)*10000,w0=R.int(2,8)*10000,w1=R.int(2,8)*10000,f0=R.int(3,9)*10000,f1=R.int(3,9)*10000,askCOGS=R.chance(.5);
  const DM=m0+mp-m1,COGM=DM+DL+OH+w0-w1,COGS=COGM+f0-f1,ans=askCOGS?COGS:COGM;
  return{s:{intro:`${eui(c)} 20X1년 원가 자료는 다음과 같다.`,table:{h:['구분','기초','기말'],r:[['원재료',won(m0),won(m1)],['재공품',won(w0),won(w1)],['제품',won(f0),won(f1)]]},lines:[`원재료 매입액 ${won(mp)} (원재료는 모두 직접재료로 사용)`,`직접노무원가 ${won(DL)}, 제조간접원가 ${won(OH)}`],q:askCOGS?`${eui(c)} 20X1년 매출원가는?`:`${eui(c)} 20X1년 당기제품제조원가는?`},
  ans,wrong:askCOGS?[COGM,COGS+f1-f0+f1-f0,mp+DL+OH+w0-w1+f0-f1,COGS+w1-w0]:[COGS,mp+DL+OH+w0-w1,DM+DL+OH,COGM+2*(w1-w0)||COGM+10000],u:'won',
  e:[`직접재료원가 = ${won(m0)} + ${won(mp)} − ${won(m1)} = ${won(DM)}`,`당기총제조원가 = ${won(DM)} + ${won(DL)} + ${won(OH)} = ${won(DM+DL+OH)}`,`당기제품제조원가 = ${won(DM+DL+OH)} + ${won(w0)} − ${won(w1)} = ${won(COGM)}`,...(askCOGS?[`매출원가 = ${won(COGM)} + ${won(f0)} − ${won(f1)} = ${won(COGS)}`]:[])]}}},

{id:'normal',p:'원가관리회계',t:'정상원가',f:R=>tries(R,()=>{const c=R.pick(CO),rate=R.int(20,60)*5,H=R.int(10,30)*1000,B=rate*H,h=H+R.int(-5,5)*500,A=B+R.int(-8,8)*10000,GP=R.int(30,80)*10000;
  const ap=rate*h,diff=A-ap;if(diff===0||Math.abs(diff)*2>GP)return null;const ans=GP-diff;
  return{s:{intro:`${eun(c)} 정상원가계산을 사용하며 직접노무시간을 기준으로 제조간접원가를 예정배부한다. 20X1년 자료는 다음과 같다.`,lines:[`제조간접원가 예산 ${won(B)}, 예정 직접노무시간 ${num(H)}시간`,`실제 제조간접원가 ${won(A)}, 실제 직접노무시간 ${num(h)}시간`,`배부차이 조정 전 매출총이익 ${won(GP)}`,`배부차이는 전액 매출원가에서 조정한다.`],q:`배부차이 조정 후 ${eui(c)} 20X1년 매출총이익은?`},
   ans,wrong:[GP+diff,GP-(A-B),GP+(A-B),GP],u:'won',
   e:[`예정배부율 = ${won(B)} ÷ ${num(H)}시간 = ${won(rate)}`,`예정배부액 = ${num(h)}시간 × ${won(rate)} = ${won(ap)}`,`배부차이 = ${won(A)} − ${won(ap)} = ${won(Math.abs(diff))} ${diff>0?'과소배부(매출원가 증가)':'과대배부(매출원가 감소)'}`,`조정 후 매출총이익 = ${won(GP)} ${diff>0?'−':'+'} ${won(Math.abs(diff))} = ${won(ans)}`]}})},

{id:'service',p:'원가관리회계',t:'보조부문 배분',f:R=>tries(R,()=>{const c=R.pick(CO),a=R.int(10,40)*10000,b=R.int(10,40)*10000;
  const x=R.pick([10,20,25]),y=R.pick([30,40,50]),z=100-x-y,u=R.pick([10,20]),v=R.pick([30,40,50,60]),w=100-u-v;if(z<=0||w<=0)return null;
  const step=R.chance(.6);let ans,e;const dP1=a*y/(y+z)+b*v/(v+w);
  if(step){const b2=b+a*x/100;ans=a*y/100+b2*v/(v+w);e=[`S1 원가 ${won(a)} 먼저 배분: S2에 ${won(a*x/100)}, P1에 ${won(a*y/100)}, P2에 ${won(a*z/100)}`,`S2 배분대상 = ${won(b)} + ${won(a*x/100)} = ${won(b2)} → P1:P2 = ${v}:${w}`,`P1 배분액 = ${won(a*y/100)} + ${won(b2)} × ${v}/${v+w} = ${won(ans)}`]}
  else{ans=dP1;e=[`직접배분법은 보조부문 상호 간 용역을 무시하고 제조부문 사용비율로만 배분`,`S1 → P1: ${won(a)} × ${y}/${y+z} = ${won(a*y/(y+z))}`,`S2 → P1: ${won(b)} × ${v}/${v+w} = ${won(b*v/(v+w))}`,`P1 배분액 = ${won(ans)}`]}
  const st2=a*y/100+(b+a*x/100)*v/(v+w),s2first=(()=>{const a2=a+b*u/100;return b*v/100+a2*y/(y+z)})();
  if(![ans,st2,s2first,dP1].every(isInt))return null;
  return{s:{intro:`${eun(c)} 보조부문 S1, S2와 제조부문 P1, P2를 운영한다. 보조부문의 용역 제공 비율과 발생원가는 다음과 같다.`,table:{h:['제공 \\ 사용','S1','S2','P1','P2','발생원가'],r:[['S1','—',x+'%',y+'%',z+'%',won(a)],['S2',u+'%','—',v+'%',w+'%',won(b)]]},q:`${step?'단계배분법(S1을 먼저 배분)':'직접배분법'}을 사용할 때 P1에 배분되는 보조부문원가 총액은?`},
   ans,wrong:[step?dP1:st2,s2first,a*y/100+b*v/100,a+b-ans],u:'won',e}})},

{id:'abc',p:'원가관리회계',t:'활동기준원가',f:R=>tries(R,()=>{const c=R.pick(CO),acts=[['생산준비','준비횟수','회'],['재료처리','처리횟수','회'],['기계가동','기계시간','시간']];
  const rows=acts.map(([n,d,un])=>{const tot=R.int(5,40)*10,rate=R.int(2,30)*100;return{n,d,un,tot,rate,cost:tot*rate,use:R.int(1,Math.max(1,Math.floor(tot/20)))*10}});
  const U=R.int(2,10)*100,dm=R.int(10,50)*10,dl=R.int(10,40)*10;const OH=rows.reduce((s,r)=>s+r.rate*r.use,0),unit=dm+dl+OH/U;if(!isInt(OH/U))return null;
  const totOH=rows.reduce((s,r)=>s+r.cost,0),mh=rows[2],trad=dm+dl+totOH/mh.tot*mh.use/U;
  return{s:{intro:`${eun(c)} 활동기준원가계산을 적용한다. 활동별 자료와 제품 A ${num(U)}단위 생산 자료는 다음과 같다.`,table:{h:['활동','원가동인','활동원가','총 원가동인 수','제품 A 사용량'],r:rows.map(r=>[r.n,r.d,won(r.cost),num(r.tot)+r.un,num(r.use)+r.un])},lines:[`제품 A 단위당 직접재료원가 ${won(dm)}, 단위당 직접노무원가 ${won(dl)}`],q:`활동기준원가계산에 의한 제품 A의 단위당 제조원가는?`},
   ans:unit,wrong:[Math.round(trad),dm+dl+Math.round(totOH/U),Math.round(OH/U),unit+dl],u:'won',
   e:[...rows.map(r=>`${r.n} 배부율 = ${won(r.cost)} ÷ ${num(r.tot)}${r.un} = ${won(r.rate)}, A 배부액 = ${won(r.rate*r.use)}`),`A 제조간접원가 = ${won(OH)} → 단위당 ${won(OH/U)}`,`단위당 제조원가 = ${won(dm)} + ${won(dl)} + ${won(OH/U)} = ${won(unit)}`]}})},

{id:'process',p:'원가관리회계',t:'종합원가',f:R=>tries(R,()=>{const c=R.pick(CO),Q0=R.int(2,8)*100,c0=R.pick([20,40,50,60]),Qs=R.int(10,30)*100,Q1=R.int(2,8)*100,c1=R.pick([20,25,40,50,60,80]),Qc=Q0+Qs-Q1;if(Qc<=Q0)return null;
  const wa=R.chance(.5),cm=R.int(3,12)*10,ck=R.int(3,12)*10,m0=R.int(2,8)*10000,k0=R.int(1,5)*10000;
  let M,K,ans,e,wrong;
  if(wa){const EUm=Qc+Q1,EUk=Qc+Q1*c1/100;M=cm*EUm-m0;K=ck*EUk-k0;if(M<=0||K<=0||!isInt(EUk))return null;ans=Qc*(cm+ck);const end=Q1*cm+Q1*c1/100*ck;
   wrong=[end,(m0+k0+M+K)-ans+ans/2|0,Qc*(cm+ck)-m0-k0,Math.round((M+K)/(Qs)*Qc)];
   e=[`완성품환산량(평균법): 재료 ${num(Qc)} + ${num(Q1)} = ${num(EUm)}, 가공 ${num(Qc)} + ${num(Q1)}×${c1}% = ${num(EUk)}`,`환산량 단위당 원가: 재료 (${won(m0)} + ${won(M)}) ÷ ${num(EUm)} = ${won(cm)}, 가공 (${won(k0)} + ${won(K)}) ÷ ${num(EUk)} = ${won(ck)}`,`완성품원가 = ${num(Qc)} × (${won(cm)} + ${won(ck)}) = ${won(ans)}`]}
  else{const EUm=Qc-Q0+Q1,EUk=Q0*(100-c0)/100+(Qc-Q0)+Q1*c1/100;M=cm*EUm;K=ck*EUk;if(!isInt(EUk))return null;ans=Q1*cm+Q1*c1/100*ck;const comp=m0+k0+M+K-ans;
   wrong=[comp,Q1*(cm+ck),Q1*cm+Q1*c0/100*ck,ans+Q0*c0/100*ck];
   e=[`완성품환산량(선입선출법): 재료 ${num(Qc)} − ${num(Q0)} + ${num(Q1)} = ${num(EUm)}, 가공 ${num(Q0)}×${100-c0}% + ${num(Qc-Q0)} + ${num(Q1)}×${c1}% = ${num(EUk)}`,`환산량 단위당 원가(당기발생원가만): 재료 ${won(M)} ÷ ${num(EUm)} = ${won(cm)}, 가공 ${won(K)} ÷ ${num(EUk)} = ${won(ck)}`,`기말재공품원가 = ${num(Q1)} × ${won(cm)} + ${num(Q1)} × ${c1}% × ${won(ck)} = ${won(ans)}`]}
  return{s:{intro:`${eun(c)} 단일공정에서 제품을 생산하며 ${wa?'가중평균법':'선입선출법'}으로 종합원가계산을 한다. 직접재료는 공정 초기에 전량 투입되고 가공원가는 공정 전반에 걸쳐 균등하게 발생한다. 공손과 감손은 없다.`,table:{h:['구분','수량','가공원가 완성도','직접재료원가','가공원가'],r:[['기초재공품',num(Q0)+'단위',c0+'%',won(m0),won(k0)],['당기착수',num(Qs)+'단위','',won(M),won(K)],['기말재공품',num(Q1)+'단위',c1+'%','','']]},q:wa?'완성품원가는?':'기말재공품원가는?'},
   ans,wrong,u:'won',e}})},

{id:'joint',p:'원가관리회계',t:'결합원가',f:R=>tries(R,()=>{const c=R.pick(CO),J=R.int(10,40)*10000,QA=R.int(2,10)*100,pa=R.int(5,30)*10,QB=R.int(2,10)*100,pb=R.int(20,60)*10,K=R.int(2,10)*10000;
  const nA=QA*pa,nB=QB*pb-K;if(nB<=0||J>(nA+nB)*0.8||J<(nA+nB)*0.3)return null;const aB=J*nB/(nA+nB);const ans=(aB+K)/QB;if(!isInt(aB)||!isInt(ans))return null;
  const sv=(J*QB*pb/(nA+QB*pb)+K)/QB,qty=(J*QB/(QA+QB)+K)/QB;
  return{s:{intro:`${eun(c)} 결합공정에서 제품 A와 B를 생산한다. 20X1년 결합원가는 ${won(J)}이며 순실현가능가치법으로 배분한다.`,lines:[`제품 A: 분리점에서 ${num(QA)}단위 생산, 단위당 ${won(pa)}에 즉시 판매`,`제품 B: 분리점에서 ${num(QB)}단위 생산, 추가가공원가 ${won(K)}을 투입한 뒤 단위당 ${won(pb)}에 판매`,`기초 및 기말 재고는 없다.`],q:`제품 B의 단위당 제조원가는?`},
   ans,wrong:[Math.round(sv),Math.round(qty),Math.round(aB/QB),Math.round((J*QB*pb/(nA+QB*pb))/QB)],u:'won',
   e:[`순실현가능가치: A = ${won(nA)}, B = ${num(QB)} × ${won(pb)} − ${won(K)} = ${won(nB)}`,`B 결합원가 배분액 = ${won(J)} × ${won(nB)}/${won(nA+nB)} = ${won(aB)}`,`B 단위당 원가 = (${won(aB)} + ${won(K)}) ÷ ${num(QB)} = ${won(ans)}`]}})},

{id:'cvp_tax',p:'원가관리회계',t:'원가추정·CVP',f:R=>tries(R,()=>{const c=R.pick(CO),P=R.int(10,50)*100,V=P-R.int(3,Math.floor(P/100)-1)*100,F=R.int(10,60)*100000,t=R.pick([20,25,30,40]),T=R.int(5,40)*100000*(100-t)/100;
  const cm=P-V,Q=(F+T/(1-t/100))/cm;if(!isInt(Q)||!isInt(T))return null;
  return{s:{intro:`${eun(c)} 단일 제품을 생산·판매한다. 단위당 판매가격 ${won(P)}, 단위당 변동원가 ${won(V)}, 연간 고정원가 ${won(F)}이며 법인세율은 ${t}%이다.`,q:`세후 목표이익 ${won(T)}을 달성하기 위한 판매량은?`},
   ans:Q,wrong:[(F+T)/cm,(F+T*(1+t/100))/cm,F/cm,(F+T/(1-t/100))/P*10].map(x=>Math.round(x)),u:'n',un:'단위',
   e:[`단위당 공헌이익 = ${won(P)} − ${won(V)} = ${won(cm)}`,`세전 목표이익 = ${won(T)} ÷ (1 − ${t}%) = ${won(T/(1-t/100))}`,`판매량 = (${won(F)} + ${won(T/(1-t/100))}) ÷ ${won(cm)} = ${num(Q)}단위`]}})},

{id:'dol',p:'원가관리회계',t:'원가추정·CVP',f:R=>tries(R,()=>{const c=R.pick(CO),Q=R.int(5,40)*100,P=R.int(10,50)*100,V=P-R.int(3,Math.floor(P/100)-1)*100,cm=P-V,CM=cm*Q,F=CM*R.pick([0.5,0.6,0.75,0.8]),OI=CM-F;
  if(!isInt(F))return null;const dol=CM/OI,g=R.pick([10,20]),askM=R.chance(.4);const bep=F/cm,mos=(Q-bep)/Q*100;
  if(askM){if(!isInt(mos))return null}else if(!isInt(dol*g))return null;
  return{s:{intro:`${eui(c)} 20X1년 자료는 다음과 같다.`,lines:[`판매량 ${num(Q)}단위, 단위당 판매가격 ${won(P)}, 단위당 변동원가 ${won(V)}`,`고정원가 ${won(F)}`],q:askM?'안전한계율은?':`판매량이 ${g}% 증가하면 영업이익은 몇 % 증가하는가? (단, 가격과 원가구조는 변하지 않는다.)`},
   ans:askM?mos:dol*g,wrong:askM?[100-mos,Math.round(bep/Q*100*10)/10,Math.round(1/dol*100)+5,mos/2]:[g,dol,Math.round(g/dol*10)/10,dol*g/2],u:'pct',
   e:askM?[`손익분기점 판매량 = ${won(F)} ÷ ${won(cm)} = ${num(bep)}단위`,`안전한계율 = (${num(Q)} − ${num(bep)}) ÷ ${num(Q)} = ${mos}%`]:[`공헌이익 = ${num(Q)} × ${won(cm)} = ${won(CM)}, 영업이익 = ${won(CM)} − ${won(F)} = ${won(OI)}`,`영업레버리지도 = ${won(CM)} ÷ ${won(OI)} = ${dol}`,`영업이익 증가율 = ${dol} × ${g}% = ${dol*g}%`]}})},

{id:'absorb',p:'원가관리회계',t:'변동·전부원가',f:R=>tries(R,()=>{const c=R.pick(CO),Qp=R.int(5,20)*100,Qs=Qp-R.int(1,4)*100,P=R.int(10,30)*100,Vm=R.int(2,5)*100,Vs=R.int(1,2)*100,Fm=R.int(10,60)*10000,Fs=R.int(5,30)*10000;
  if(P<=Vm+Vs)return null;const fu=Fm/Qp;if(!isInt(fu))return null;const vOI=(P-Vm-Vs)*Qs-Fm-Fs,aOI=vOI+fu*(Qp-Qs),askV=R.chance(.3);const ans=askV?vOI:aOI;
  return{s:{intro:`20X1년 초 영업을 시작한 ${eui(c)} 자료는 다음과 같다.`,lines:[`생산량 ${num(Qp)}단위, 판매량 ${num(Qs)}단위`,`단위당 판매가격 ${won(P)}`,`단위당 변동제조원가 ${won(Vm)}, 단위당 변동판매관리비 ${won(Vs)}`,`고정제조간접원가 ${won(Fm)}, 고정판매관리비 ${won(Fs)}`],q:askV?'변동원가계산에 의한 20X1년 영업이익은?':'전부원가계산에 의한 20X1년 영업이익은?'},
   ans,wrong:askV?[aOI,vOI+Fs,(P-Vm)*Qs-Fm-Fs,vOI-fu*(Qp-Qs)]:[vOI,vOI-fu*(Qp-Qs),Math.round(vOI+Fm/Qs*(Qp-Qs)),aOI+Fs],u:'pl',lab:['이익','손실'],
   e:[`변동원가 영업이익 = (${won(P)} − ${won(Vm)} − ${won(Vs)}) × ${num(Qs)} − ${won(Fm)} − ${won(Fs)} = ${won(vOI)}`,`단위당 고정제조간접원가 = ${won(Fm)} ÷ ${num(Qp)} = ${won(fu)}`,`전부원가 영업이익 = 변동원가 이익 + 기말재고에 포함된 고정제조간접원가(${num(Qp-Qs)} × ${won(fu)}) = ${won(aOI)}`]}})},

{id:'dm_var',p:'원가관리회계',t:'표준원가',f:R=>tries(R,()=>{const c=R.pick(CO),N=R.int(5,20)*100,sq=R.int(2,6),SP=R.int(5,30)*10,AQ=N*sq+R.int(-10,10)*20,AP=SP+R.int(-5,5)*5;
  if(AQ===N*sq||AP===SP)return null;const pv=AQ*(AP-SP),qv=(AQ-N*sq)*SP,askP=R.chance(.5),ans=askP?pv:qv;
  return{s:{intro:`${eun(c)} 표준원가계산을 사용한다. 제품 단위당 직접재료 표준은 ${sq}kg, kg당 표준가격은 ${won(SP)}이다. 20X1년 ${num(N)}단위를 생산하면서 직접재료 ${num(AQ)}kg을 kg당 ${won(AP)}에 구입하여 전량 사용하였다.`,q:askP?'직접재료원가 가격차이는?':'직접재료원가 수량(능률)차이는?'},
   ans,wrong:askP?[-pv,qv,(AQ-N*sq)*AP,N*sq*(AP-SP)]:[-qv,pv,(AQ-N*sq)*AP,pv+qv],u:'var',
   e:[`가격차이 = ${num(AQ)}kg × (${won(AP)} − ${won(SP)}) = ${won(Math.abs(pv))} ${pv>0?'불리':'유리'}`,`표준수량 = ${num(N)}단위 × ${sq}kg = ${num(N*sq)}kg`,`수량차이 = (${num(AQ)} − ${num(N*sq)})kg × ${won(SP)} = ${won(Math.abs(qv))} ${qv>0?'불리':'유리'}`]}})},

{id:'dl_var',p:'원가관리회계',t:'표준원가',f:R=>tries(R,()=>{const c=R.pick(CO),N=R.int(5,20)*100,sh=R.int(2,5),SR=R.int(5,20)*100,AH=N*sh+R.int(-10,10)*50,AR=SR+R.int(-4,4)*50;
  if(AH===N*sh||AR===SR)return null;const rv=AH*(AR-SR),ev=(AH-N*sh)*SR,askR=R.chance(.4),ans=askR?rv:ev;
  return{s:{intro:`${eun(c)} 표준원가계산을 사용한다. 제품 단위당 표준 직접노무시간은 ${sh}시간, 시간당 표준임률은 ${won(SR)}이다. 20X1년 실제 생산량은 ${num(N)}단위이며, 실제 직접노무시간 ${num(AH)}시간에 대해 ${won(AH*AR)}의 직접노무원가가 발생하였다.`,q:askR?'직접노무원가 임률차이는?':'직접노무원가 능률차이는?'},
   ans,wrong:askR?[-rv,ev,N*sh*(AR-SR),rv+ev]:[-ev,rv,(AH-N*sh)*AR,rv+ev],u:'var',
   e:[`실제임률 = ${won(AH*AR)} ÷ ${num(AH)}시간 = ${won(AR)}`,`임률차이 = ${num(AH)} × (${won(AR)} − ${won(SR)}) = ${won(Math.abs(rv))} ${rv>0?'불리':'유리'}`,`능률차이 = (${num(AH)} − ${num(N)}×${sh})시간 × ${won(SR)} = ${won(Math.abs(ev))} ${ev>0?'불리':'유리'}`]}})},

{id:'fohvol',p:'원가관리회계',t:'표준원가',f:R=>tries(R,()=>{const c=R.pick(CO),rate=R.int(5,30)*10,s=R.pick([2,3,4]),H=s*R.int(4,15)*1000,F=rate*H,N=H/s+R.int(-8,8)*100,A=F+R.int(-5,5)*10000;
  const std=N*s;if(std===H||A===F)return null;const vol=F-std*rate,bud=A-F,askB=R.chance(.3),ans=askB?bud:vol;
  return{s:{intro:`${eun(c)} 고정제조간접원가를 직접노무시간 기준으로 배부한다. 연간 고정제조간접원가 예산은 ${won(F)}, 기준조업도는 ${num(H)}시간이며 제품 단위당 표준 직접노무시간은 ${s}시간이다. 20X1년 실제 생산량은 ${num(N)}단위, 실제 고정제조간접원가는 ${won(A)}이다.`,q:askB?'고정제조간접원가 예산(소비)차이는?':'고정제조간접원가 조업도차이는?'},
   ans,wrong:askB?[-bud,vol,A-std*rate]:[-vol,bud,A-std*rate,(H-N*s)*rate/2],u:'var',
   e:[`고정제조간접원가 표준배부율 = ${won(F)} ÷ ${num(H)}시간 = ${won(rate)}`,`표준배부액 = ${num(N)}단위 × ${s}시간 × ${won(rate)} = ${won(std*rate)}`,`예산차이 = ${won(A)} − ${won(F)} = ${won(Math.abs(bud))} ${bud>0?'불리':'유리'}`,`조업도차이 = ${won(F)} − ${won(std*rate)} = ${won(Math.abs(vol))} ${vol>0?'불리':'유리'}`]}})},

{id:'special',p:'원가관리회계',t:'의사결정',f:R=>tries(R,()=>{const c=R.pick(CO),Cap=R.int(10,30)*1000,Qn=Cap-R.int(1,6)*500,P=R.int(10,30)*100,vm=R.int(3,8)*100,vs=R.int(1,2)*100,fu=R.int(1,4)*100,q=R.int(2,10)*500,p2=vm+R.int(1,8)*100,save=R.chance(.5)?vs/2:0,K=R.int(0,3)*10000;
  if(P<=vm+vs)return null;const idle=Cap-Qn,lost=Math.max(0,q-idle),d=q*(p2-vm-(vs-save))-K-lost*(P-vm-vs);if(d===0)return null;
  return{s:{intro:`${eun(c)} 연간 최대생산능력 ${num(Cap)}단위 중 ${num(Qn)}단위를 단위당 ${won(P)}에 판매하고 있다. 단위당 원가는 변동제조원가 ${won(vm)}, 변동판매비 ${won(vs)}, 고정제조간접원가 배부액 ${won(fu)}이다.`,lines:[`해외 거래처가 ${num(q)}단위를 단위당 ${won(p2)}에 일괄 구매하겠다는 특별주문을 제안하였다.`,save?`특별주문분은 단위당 변동판매비가 ${won(save)} 절감된다.`:`특별주문분에도 변동판매비는 동일하게 발생한다.`,K?`특별주문을 위해 전용 포장설비 임차료 ${won(K)}이 추가로 발생한다.`:`특별주문으로 고정원가는 변하지 않는다.`,`특별주문은 전량 수락하거나 거절해야 하며, 생산능력을 초과하면 정규 판매를 줄여야 한다.`],q:'특별주문을 수락할 경우 영업이익의 변화는?'},
   ans:d,wrong:[d+lost*(P-vm-vs),q*(p2-vm-vs-fu)-K,d+K,q*(p2-vm-(vs-save))-K-lost*P],u:'pl',lab:['증가','감소'],
   e:[`여유생산능력 = ${num(Cap)} − ${num(Qn)} = ${num(idle)}단위${lost?`, 부족분 ${num(lost)}단위는 정규 판매 포기`:''}`,`특별주문 공헌이익 = ${num(q)} × (${won(p2)} − ${won(vm)} − ${won(vs-save)}) = ${won(q*(p2-vm-vs+save))}`,...(K?[`추가 고정원가 −${won(K)}`]:[]),...(lost?[`정규 판매 포기에 따른 공헌이익 감소 = ${num(lost)} × ${won(P-vm-vs)} = ${won(lost*(P-vm-vs))}`]:[]),`고정제조간접원가 배부액은 비관련원가`,`영업이익 ${won(Math.abs(d))} ${d>0?'증가':'감소'}`]}})},

{id:'make_buy',p:'원가관리회계',t:'의사결정',f:R=>tries(R,()=>{const c=R.pick(CO),N=R.int(2,10)*1000,dm=R.int(2,6)*100,dl=R.int(1,4)*100,vo=R.int(1,3)*50,fo=R.int(1,4)*100,av=R.pick([0,20,40,50]),B=dm+dl+vo+R.int(-2,4)*50,Rent=R.int(0,5)*50000;
  const F=fo*N,d=(dm+dl+vo)*N+F*av/100+Rent-B*N;if(d===0||!isInt(F*av/100))return null;
  return{s:{intro:`${eun(c)} 부품 ${num(N)}단위를 자가제조하고 있으며 단위당 제조원가는 다음과 같다.`,table:{h:['항목','단위당 원가'],r:[['직접재료원가',won(dm)],['직접노무원가',won(dl)],['변동제조간접원가',won(vo)],['고정제조간접원가(배부액)',won(fo)]]},lines:[`외부 공급업체가 이 부품을 단위당 ${won(B)}에 공급하겠다고 제안하였다.`,av?`외부구입 시 고정제조간접원가 중 ${av}%를 회피할 수 있다.`:`고정제조간접원가는 외부구입을 하더라도 회피할 수 없다.`,Rent?`외부구입 시 여유 설비를 임대하여 연 ${won(Rent)}의 임대수익을 얻을 수 있다.`:`외부구입 시 여유 설비는 다른 용도가 없다.`],q:'외부구입을 선택할 경우 영업이익의 변화는?'},
   ans:d,wrong:[d+F*(1-av/100),d-Rent,d-F*av/100,(dm+dl+vo+fo)*N+Rent-B*N],u:'pl',lab:['증가','감소'],
   e:[`회피가능원가 = (${won(dm)} + ${won(dl)} + ${won(vo)}) × ${num(N)} + 고정제조간접원가 ${won(F)} × ${av}% = ${won((dm+dl+vo)*N+F*av/100)}`,`설비 임대수익 ${won(Rent)}`,`외부구입원가 = ${won(B)} × ${num(N)} = ${won(B*N)}`,`영업이익 ${won(Math.abs(d))} ${d>0?'증가':'감소'}`]}})},

{id:'ri',p:'원가관리회계',t:'성과평가',f:R=>tries(R,()=>{const c=R.pick(CO),A=R.int(10,50)*1000000,roi=R.pick([12,15,18,20]),I=A*roi/100,r=R.pick([8,10,12]),X=R.int(2,10)*1000000,y=R.pick([9,11,13,14,16]);
  const ri0=I-A*r/100,ri1=ri0+X*(y-r)/100;if(ri0<=0||ri1<=0)return null;const askNew=R.chance(.6),ans=askNew?ri1:ri0;
  return{s:{intro:`${eui(c)} A사업부는 영업자산 ${won(A)}으로 영업이익 ${won(I)}을 올리고 있다. 회사의 최저필수수익률은 ${r}%이다.`,lines:askNew?[`A사업부는 ${won(X)}을 투자하면 연 ${won(X*y/100)}의 영업이익을 추가로 얻는 투자안을 검토하고 있다.`]:[],q:askNew?'A사업부가 이 투자안을 채택할 경우 잔여이익은?':'A사업부의 잔여이익은?'},
   ans,wrong:askNew?[ri0,I+X*y/100,ri1+X*r/100,(I+X*y/100)-(A)*r/100]:[I,A*r/100,I-A*roi/200,ri0*2],u:'won',
   e:[`잔여이익 = 영업이익 − 영업자산 × 최저필수수익률`,`현재 = ${won(I)} − ${won(A)} × ${r}% = ${won(ri0)}`,...(askNew?[`투자안 채택 후 = (${won(I)} + ${won(X*y/100)}) − (${won(A)} + ${won(X)}) × ${r}% = ${won(ri1)}`]:[])]}})},

{id:'transfer',p:'원가관리회계',t:'성과평가',f:R=>tries(R,()=>{const c=R.pick(CO),Cap=R.int(10,30)*1000,Qe=Cap-R.int(0,8)*1000,Pe=R.int(10,30)*100,v=R.int(3,8)*100,s=R.int(0,2)*50,Qt=R.int(2,8)*1000;
  const idle=Cap-Qe,lost=Math.max(0,Qt-idle),mn=v-s+(Pe-v)*lost/Qt;if(!isInt(mn)||Pe<=v)return null;
  return{s:{intro:`${eui(c)} 부품사업부는 연간 최대생산능력 ${num(Cap)}단위로 외부시장에 ${num(Qe)}단위를 단위당 ${won(Pe)}에 판매하고 있다. 단위당 변동원가는 ${won(v)}이다.`,lines:[`조립사업부가 부품 ${num(Qt)}단위를 사내대체해 줄 것을 요청하였다.`,s?`사내대체 시 단위당 변동판매비 ${won(s)}이 절감된다.`:`사내대체 시 절감되는 원가는 없다.`,`외부 판매량은 생산능력 범위에서 줄일 수 있다.`],q:'부품사업부가 받아들일 수 있는 단위당 최소대체가격은?'},
   ans:mn,wrong:[v,Pe,v-s+(Pe-v),v+(Pe-v)*lost/Qt].filter(x=>isInt(x)),u:'won',
   e:[`여유생산능력 = ${num(Cap)} − ${num(Qe)} = ${num(idle)}단위, 외부판매 포기 = ${num(lost)}단위`,`최소대체가격 = 단위당 변동원가(절감액 차감) ${won(v-s)} + 단위당 기회원가 ${won((Pe-v)*lost/Qt)}`,`= ${won(mn)}`]}})},

{id:'cash',p:'원가관리회계',t:'예산',f:R=>tries(R,()=>{const c=R.pick(CO),S1=R.int(10,40)*10000,S2=R.int(10,40)*10000,S3=R.int(10,40)*10000,cs=R.pick([20,30,40]),b=R.pick([30,40,50,60]),cc=R.pick([20,30,40]),d=100-b-cc-R.pick([0,5]);if(d<0)return null;const bad=100-b-cc-d;
  const cr=(100-cs)/100,ans=S3*cs/100+cr*(S3*b+S2*cc+S1*d)/100;if(!isInt(ans))return null;
  return{s:{intro:`${eun(c)} 월별 매출 예산을 다음과 같이 편성하였다.`,table:{h:['구분','1월','2월','3월'],r:[['매출액',won(S1),won(S2),won(S3)]]},lines:[`매출액의 ${cs}%는 현금매출이고 나머지는 외상매출이다.`,`외상매출은 판매한 달에 ${b}%, 다음 달에 ${cc}%, 그다음 달에 ${d}%가 회수${bad?`되고 나머지 ${bad}%는 회수되지 않는다`:'된다'}.`],q:'3월의 매출 관련 현금유입액은?'},
   ans,wrong:[S3*cs/100+cr*S3,S3*cs/100+(S3*b+S2*cc+S1*d)/100,cr*(S3*b+S2*cc+S1*d)/100,S3*cs/100+cr*(S3*b+S2*cc)/100],u:'won',
   e:[`현금매출 = ${won(S3)} × ${cs}% = ${won(S3*cs/100)}`,`외상매출 회수 = 3월분 ${won(S3*cr*b/100)} + 2월분 ${won(S2*cr*cc/100)} + 1월분 ${won(S1*cr*d/100)}`,`현금유입 = ${won(ans)}`]}})}
];

function fmtVal(g,v){if(g.u==='won')return won(v);if(g.u==='n')return num(v)+(g.un||'');if(g.u==='pct')return (Math.round(v*10)/10)+'%';
  if(g.u==='pl'){if(v===0)return '영향 없음';return won(Math.abs(v))+' '+(v>0?g.lab[0]:g.lab[1])}
  if(g.u==='var'){if(v===0)return '차이 없음';return won(Math.abs(v))+' '+(v>0?'불리':'유리')}return String(v)}
function niceStep(x){x=Math.abs(x)||1;const e=Math.pow(10,Math.floor(Math.log10(x))-1);return Math.max(1,Math.round(x/10/e)*e)}
function makeQ(gen,seed){const R=mkR(seed);const g=gen.f(R);g.u=g.u||'won';
  const ans=g.u==='pct'?Math.round(g.ans*10)/10:Math.round(g.ans);const seen=new Set([fmtVal(g,ans)]),opts=[ans];
  for(const w0 of g.wrong){if(opts.length>=5)break;if(w0==null||!isFinite(w0))continue;const w=g.u==='pct'?Math.round(w0*10)/10:Math.round(w0);
    if((g.u==='won'||g.u==='n'||g.u==='pct')&&w<=0)continue;const k=fmtVal(g,w);if(seen.has(k))continue;seen.add(k);opts.push(w)}
  const st=g.u==='pct'?Math.max(1,Math.round(Math.abs(ans)/5)):niceStep(ans);let k=1;
  while(opts.length<5&&k<40){for(const s of [k,-k]){if(opts.length>=5)break;const w=ans+s*st;if((g.u==='won'||g.u==='n'||g.u==='pct')&&w<=0)continue;const f=fmtVal(g,w);if(!seen.has(f)){seen.add(f);opts.push(w)}}k++}
  const sorted=opts.slice().sort((a,b)=>a-b);
  return{kind:'calc',gid:gen.id,p:gen.p,t:gen.t,s:g.s,o:sorted.map(v=>fmtVal(g,v)),a:sorted.indexOf(ans),e:g.e}}
if(typeof module!=='undefined')module.exports={GENS,makeQ};

</script>
<script>
/* 말문제 은행: a는 정답(옳지 않은 지문 등) 위치, 화면에서는 보기 순서를 섞는다. */
const CONCEPT=[
{p:'재무회계',t:'개념체계',q:'재무정보의 질적 특성에 관한 설명으로 옳지 않은 것은?',o:['근본적 질적 특성은 목적적합성과 표현충실성이다.','보강적 질적 특성에는 비교가능성, 검증가능성, 적시성, 이해가능성이 있다.','중요성은 기업 특유 관점의 목적적합성이므로 회계기준위원회가 중요성에 대한 획일적인 계량 임계치를 미리 정할 수 있다.','완벽한 표현충실성을 위해서는 서술이 완전하고, 중립적이며, 오류가 없어야 한다.','일반목적재무보고서는 보고기업의 가치를 보여주기 위해 고안된 것이 아니다.'],a:2,e:'회계기준위원회는 중요성에 대한 획일적인 계량 임계치를 정하거나 특정한 상황에서 무엇이 중요한지를 미리 결정할 수 없다.'},
{p:'재무회계',t:'개념체계',q:'개념체계의 측정기준에 관한 설명으로 옳지 않은 것은?',o:['자산의 역사적원가는 자산을 취득하면서 지급한 대가에 거래원가를 포함한 가치이다.','자산의 현행원가는 측정일의 동등한 자산의 원가로서 지급할 대가와 그날 발생할 거래원가를 포함한다.','공정가치는 자산을 취득할 때 발생한 거래원가로 인해 증가하지 않는다.','사용가치와 이행가치는 직접 관측될 수 있으며 시장참여자의 가정을 반영한다.','부채의 역사적원가는 부채를 발생시키면서 수취한 대가에서 거래원가를 차감한 가치이다.'],a:3,e:'사용가치와 이행가치는 직접 관측될 수 없으므로 현금흐름기준 측정기법으로 결정하며, 시장참여자의 가정이 아니라 기업 특유의 가정을 반영한다.'},
{p:'재무회계',t:'개념체계',q:'자본유지개념에 관한 설명으로 옳지 않은 것은?',o:['재무자본유지개념에서 이익은 기말 순자산의 재무적 측정금액이 기초 순자산을 초과하는 경우에만 발생한다.','재무자본유지개념은 명목화폐단위나 불변구매력단위로 측정할 수 있다.','재무자본유지개념을 사용하려면 현행원가기준에 따라 측정해야 한다.','실물자본유지개념에서 이익은 기말 실물생산능력이 기초 실물생산능력을 초과하는 경우에만 발생한다.','실물자본유지개념에서 자산과 부채의 가격변동은 이익이 아니라 자본유지조정으로 처리한다.'],a:2,e:'현행원가기준 측정이 필요한 것은 실물자본유지개념이다. 재무자본유지개념은 특정한 측정기준의 적용을 요구하지 않는다.'},
{p:'재무회계',t:'재무제표 표시',q:'재무제표 작성과 표시의 일반원칙에 관한 설명으로 옳지 않은 것은?',o:['기업은 현금흐름 정보를 제외하고는 발생기준 회계를 사용하여 재무제표를 작성한다.','재고자산평가충당금을 차감하여 관련 자산을 순액으로 측정하는 것은 상계표시에 해당하지 않는다.','경영진이 기업을 청산할 의도가 있더라도 재무제표는 계속기업을 전제로 작성한다.','중요하지 않은 항목은 성격이나 기능이 유사한 항목과 통합하여 표시할 수 있다.','전체 재무제표는 적어도 1년마다 작성한다.'],a:2,e:'경영진이 기업을 청산하거나 경영활동을 중단할 의도가 있거나 그럴 수밖에 없는 경우에는 계속기업을 전제로 재무제표를 작성하지 않는다.'},
{p:'재무회계',t:'재무제표 표시',q:'유동항목과 비유동항목의 구분에 관한 설명으로 옳지 않은 것은?',o:['보고기간 후 12개월 이내에 결제하기로 되어 있는 부채는 원칙적으로 유동부채로 분류한다.','보고기간 말 이전에 장기차입약정을 위반하여 즉시 상환 요구가 가능해진 채무라도, 보고기간 후 재무제표 발행승인일 전에 대여자가 상환을 요구하지 않기로 합의하면 비유동부채로 분류한다.','정상영업주기 내에 판매되는 재고자산은 보고기간 후 12개월 이내에 실현되지 않더라도 유동자산으로 분류한다.','유동·비유동 구분 표시를 하는 경우 이연법인세자산은 유동자산으로 분류하지 않는다.','유동성 순서에 따른 표시가 신뢰성 있고 더 목적적합한 정보를 제공하면 자산과 부채를 유동성 순서로 표시할 수 있다.'],a:1,e:'상환을 요구하지 않기로 한 합의가 보고기간 후에 이루어졌다면 그 채무는 유동부채로 분류한다.'},
{p:'재무회계',t:'재고자산',q:'재고자산에 관한 설명으로 옳지 않은 것은?',o:['재고자산의 취득원가에는 매입원가, 전환원가 및 현재의 장소와 상태에 이르게 하는 데 발생한 기타 원가가 포함된다.','후속 생산단계에 투입하기 전에 보관이 필요한 경우가 아닌 보관원가는 재고자산 원가에 포함하지 않는다.','통상적으로 상호 교환 가능한 대량의 재고자산 단위원가는 선입선출법이나 가중평균법으로 결정한다.','원재료의 현행대체원가가 하락하면 완성될 제품이 원가 이상으로 판매될 것으로 예상되더라도 원재료를 감액한다.','순실현가능가치는 예상 판매가격에서 예상되는 추가 완성원가와 판매비용을 차감한 금액이다.'],a:3,e:'생산에 투입할 원재료는 완성될 제품이 원가 이상으로 판매될 것으로 예상되면 감액하지 않는다.'},
{p:'재무회계',t:'재고자산',q:'재고자산의 원가와 단위원가 결정에 관한 설명으로 옳지 않은 것은?',o:['비정상적으로 낭비된 재료원가는 재고자산 원가에서 제외하고 발생기간의 비용으로 인식한다.','판매원가는 재고자산 원가에 포함하지 않는다.','후불조건으로 취득하면서 정상신용조건 가격보다 많이 지급한 차액은 금융기간 동안 이자비용으로 인식한다.','성격과 용도가 유사한 재고자산이라도 지역별 위치나 과세방식이 다르면 서로 다른 단위원가 결정방법을 적용할 수 있다.','순실현가능가치 상승으로 인한 감액 환입액은 환입이 발생한 기간에 비용으로 인식된 재고자산 금액에서 차감한다.'],a:3,e:'지역별 위치나 과세방식이 다르다는 이유만으로 동일한 성격의 재고자산에 서로 다른 단위원가 결정방법을 적용할 수 없다.'},
{p:'재무회계',t:'유형자산',q:'유형자산의 원가에 관한 설명으로 옳지 않은 것은?',o:['설치장소 준비원가와 최초의 운송 및 취급 관련 원가는 유형자산의 원가에 포함한다.','새로운 시설을 개설하는 데 소요되는 원가는 유형자산의 원가에 포함하지 않는다.','자산이 정상적으로 작동되는지 시험하는 과정에서 발생하는 원가는 유형자산의 원가에 포함한다.','경영진이 의도하는 방식으로 가동될 수 있으나 아직 실제로 사용되지 않는 기간에 발생한 원가는 유형자산의 원가에 포함한다.','자산을 해체·제거하거나 부지를 복구하는 데 소요될 것으로 최초에 추정되는 원가는 유형자산의 원가에 포함한다.'],a:3,e:'경영진이 의도하는 방식으로 가동될 수 있는 상태에 이른 뒤 발생한 원가는 실제 사용 전이라도 유형자산의 원가에 포함하지 않는다.'},
{p:'재무회계',t:'유형자산',q:'유형자산의 감가상각에 관한 설명으로 옳지 않은 것은?',o:['감가상각방법은 적어도 매 회계연도 말에 재검토한다.','잔존가치와 내용연수의 변경은 회계추정의 변경으로 처리한다.','유형자산이 가동되지 않거나 유휴상태가 되면 감가상각을 중단한다.','토지와 건물을 동시에 취득하더라도 분리 가능한 자산이므로 별개의 자산으로 회계처리한다.','자산 사용을 포함하는 활동에서 창출되는 수익에 기초한 감가상각방법은 적절하지 않다.'],a:2,e:'유형자산이 유휴상태가 되더라도 완전히 상각되기 전까지는 감가상각을 중단하지 않는다(사용량비례법 제외).'},
{p:'재무회계',t:'유형자산',q:'유형자산의 재평가모형에 관한 설명으로 옳지 않은 것은?',o:['특정 유형자산을 재평가하면 해당 자산이 포함되는 유형자산 분류 전체를 재평가한다.','재평가로 장부금액이 증가하면 기타포괄손익으로 인식하되, 과거에 당기손익으로 인식한 재평가감소액이 있으면 그 범위까지 당기손익으로 인식한다.','재평가잉여금은 자산을 사용함에 따라 일부를 이익잉여금으로 대체할 수 있다.','재평가잉여금을 이익잉여금으로 대체할 때에는 당기손익을 거쳐 대체한다.','재평가는 보고기간 말 장부금액이 공정가치와 중요하게 차이가 나지 않도록 주기적으로 수행한다.'],a:3,e:'재평가잉여금을 이익잉여금으로 대체할 때에는 당기손익으로 인식하지 않고 자본 내에서 직접 대체한다.'},
{p:'재무회계',t:'차입원가',q:'차입원가의 자본화에 관한 설명으로 옳지 않은 것은?',o:['적격자산은 의도된 용도로 사용하거나 판매 가능한 상태에 이르게 하는 데 상당한 기간이 필요한 자산이다.','금융자산과 단기간 내에 제조되는 재고자산은 적격자산에 해당하지 않는다.','특정차입금의 일시적 운용에서 생긴 투자수익은 자본화가능차입원가에서 차감한다.','일반차입금에 대하여 자본화할 차입원가는 회계기간 동안 실제 발생한 차입원가를 초과할 수 있다.','적격자산에 대한 적극적인 개발활동을 장기간 중단한 기간에는 차입원가의 자본화를 중단한다.'],a:3,e:'일반차입금과 관련하여 자본화하는 차입원가는 해당 기간 동안 실제 발생한 차입원가를 초과할 수 없다.'},
{p:'재무회계',t:'무형자산',q:'무형자산에 관한 설명으로 옳지 않은 것은?',o:['내부적으로 창출한 영업권은 자산으로 인식하지 않는다.','연구단계에서 발생한 지출은 발생시점에 비용으로 인식한다.','내부적으로 창출한 브랜드와 고객목록은 무형자산으로 인식하지 않는다.','내용연수가 비한정인 무형자산은 상각하지 않고 매년 손상검사를 한다.','최초에 비용으로 인식한 무형항목에 대한 지출은 그 후 인식요건을 충족하면 무형자산의 원가로 인식할 수 있다.'],a:4,e:'최초에 비용으로 인식한 무형항목에 대한 지출은 그 이후에 무형자산의 원가로 인식할 수 없다.'},
{p:'재무회계',t:'무형자산',q:'무형자산의 후속측정에 관한 설명으로 옳지 않은 것은?',o:['상각방법은 자산의 미래경제적효익이 소비될 것으로 예상되는 형태를 반영한다.','소비 형태를 신뢰성 있게 결정할 수 없으면 정액법을 사용한다.','내용연수가 유한한 무형자산의 잔존가치는 원칙적으로 영(0)으로 본다.','내용연수가 비한정인 무형자산을 유한한 것으로 재평가하는 것은 회계정책의 변경이다.','재평가모형은 재평가 목적상 공정가치를 활성시장을 기초로 측정할 수 있는 경우에만 적용할 수 있다.'],a:3,e:'비한정 내용연수를 유한 내용연수로 재평가하는 것은 회계추정의 변경으로 처리한다.'},
{p:'재무회계',t:'투자부동산',q:'투자부동산의 분류에 관한 설명으로 옳지 않은 것은?',o:['임대수익이나 시세차익을 얻기 위하여 보유하는 부동산은 투자부동산이다.','장래 사용목적을 결정하지 못한 채로 보유하고 있는 토지는 투자부동산이다.','처분예정인 자가사용부동산은 투자부동산으로 분류한다.','공정가치모형을 적용하면 공정가치 변동으로 발생하는 손익은 발생한 기간의 당기손익에 반영한다.','공정가치모형을 적용하는 투자부동산은 감가상각하지 않는다.'],a:2,e:'처분예정인 자가사용부동산은 투자부동산이 아니라 자가사용부동산으로 분류한다.'},
{p:'재무회계',t:'투자부동산',q:'투자부동산의 계정대체에 관한 설명으로 옳지 않은 것은?',o:['공정가치모형 투자부동산을 자가사용부동산으로 대체하면 사용목적 변경시점의 공정가치를 이후 회계처리의 간주원가로 한다.','투자부동산의 공정가치를 계속하여 신뢰성 있게 측정하기 어려운 예외적인 경우에는 원가모형으로 측정한다.','자가사용부동산을 공정가치모형 투자부동산으로 대체하는 경우 변경시점까지 감가상각하고 공정가치와의 차액은 재평가모형과 같은 방식으로 처리한다.','원가모형을 적용하는 경우 투자부동산, 자가사용부동산, 재고자산 사이에 대체가 발생하면 대체 전 장부금액을 승계한다.','재고자산을 공정가치모형 투자부동산으로 대체하는 경우 장부금액과 공정가치의 차액은 기타포괄손익으로 인식한다.'],a:4,e:'재고자산을 공정가치로 평가하는 투자부동산으로 대체할 때 생기는 차액은 당기손익으로 인식한다.'},
{p:'재무회계',t:'금융자산',q:'금융자산의 분류와 측정에 관한 설명으로 옳지 않은 것은?',o:['계약상 현금흐름 수취 목적의 사업모형에서 원리금만으로 구성된 현금흐름이 발생하는 채무상품은 상각후원가로 측정한다.','현금흐름 수취와 매도 둘 다를 목적으로 하는 사업모형의 채무상품은 기타포괄손익-공정가치로 측정한다.','단기매매항목이 아닌 지분상품은 최초 인식 시 기타포괄손익-공정가치 측정 항목으로 지정하는 취소 불가능한 선택을 할 수 있다.','기타포괄손익-공정가치 측정으로 지정한 지분상품을 처분하면 누적 기타포괄손익을 당기손익으로 재분류한다.','회계불일치를 제거하거나 유의적으로 줄이는 경우 금융자산을 당기손익-공정가치 측정 항목으로 지정할 수 있다.'],a:3,e:'기타포괄손익-공정가치 측정 지정 지분상품의 누적평가손익은 처분 시에도 당기손익으로 재분류하지 않는다(이익잉여금으로 대체는 가능).'},
{p:'재무회계',t:'금융자산',q:'금융자산의 재분류와 손상에 관한 설명으로 옳지 않은 것은?',o:['금융자산은 사업모형을 변경하는 경우에만 재분류한다.','금융부채는 재분류하지 않는다.','상각후원가 측정 금융자산을 당기손익-공정가치 측정으로 재분류하면 재분류일의 공정가치와 장부금액의 차이를 당기손익으로 인식한다.','신용이 손상된 금융자산의 이자수익은 상각후원가에 유효이자율을 적용하여 계산한다.','기타포괄손익-공정가치 측정 채무상품의 손실충당금은 재무상태표에서 해당 금융자산의 장부금액을 줄인다.'],a:4,e:'기타포괄손익-공정가치 측정 채무상품의 손실충당금은 기타포괄손익으로 인식하며, 재무상태표의 장부금액(공정가치)을 줄이지 않는다.'},
{p:'재무회계',t:'금융부채·사채',q:'사채의 회계처리에 관한 설명으로 옳지 않은 것은? (단, 유효이자율법을 적용한다.)',o:['할인발행한 사채는 매년 인식하는 이자비용이 증가한다.','할증발행한 사채는 매년 인식하는 이자비용이 감소한다.','할인발행한 사채의 장부금액은 만기에 가까워질수록 증가한다.','사채발행비가 발생하면 유효이자율은 발행 당시 시장이자율보다 낮아진다.','만기 전에 상환하면 상환금액과 장부금액의 차이를 당기손익으로 인식한다.'],a:3,e:'사채발행비는 사채의 발행금액(순현금유입)을 줄이므로 유효이자율은 시장이자율보다 높아진다.'},
{p:'재무회계',t:'충당부채',q:'충당부채에 관한 설명으로 옳지 않은 것은?',o:['과거사건의 결과로 현재의무가 존재하고, 자원이 유출될 가능성이 높으며, 금액을 신뢰성 있게 추정할 수 있으면 충당부채를 인식한다.','미래의 예상 영업손실은 충당부채로 인식하지 않는다.','화폐의 시간가치 영향이 중요하면 충당부채는 의무를 이행하는 데 필요한 지출의 현재가치로 평가한다.','예상되는 자산 처분이익은 충당부채를 측정할 때 고려하지 않는다.','충당부채를 인식하려면 경제적효익이 있는 자원의 유출 가능성이 매우 높아야 한다.'],a:4,e:'자원 유출 가능성이 "높으면(발생하지 않을 가능성보다 클 때)" 충분하며 "매우 높을" 필요는 없다.'},
{p:'재무회계',t:'충당부채',q:'우발부채와 우발자산에 관한 설명으로 옳지 않은 것은?',o:['우발부채는 재무제표에 부채로 인식하지 않는다.','자원 유출 가능성이 아주 낮지 않다면 우발부채를 주석으로 공시한다.','우발자산은 경제적효익의 유입 가능성이 높은 경우에 주석으로 공시한다.','수익의 실현이 거의 확실하다면 관련 자산은 우발자산이 아니므로 자산으로 인식한다.','과거에 우발부채로 처리했다면 이후 충당부채의 인식요건을 충족하더라도 충당부채로 인식하지 않는다.'],a:4,e:'우발부채는 계속 평가하며, 이후 충당부채의 인식요건을 충족하게 되면 그 기간에 충당부채로 인식한다.'},
{p:'재무회계',t:'자본',q:'자본에 관한 설명으로 옳지 않은 것은?',o:['자기주식을 취득하면 취득원가를 자본에서 차감한다.','자기주식처분이익은 자본잉여금으로 처리한다.','주식배당과 무상증자는 자본총계를 변동시키지 않는다.','주식분할을 하면 주당 액면금액이 감소하지만 자본금은 변하지 않는다.','보고기간 후 재무제표 발행승인일 전에 선언한 배당은 보고기간 말의 부채로 인식한다.'],a:4,e:'보고기간 후에 선언한 배당은 보고기간 말에 존재하는 의무가 아니므로 부채로 인식하지 않고 주석으로 공시한다.'},
{p:'재무회계',t:'수익',q:'고객과의 계약에서 생기는 수익에 관한 설명으로 옳지 않은 것은?',o:['수익은 계약 식별, 수행의무 식별, 거래가격 산정, 거래가격 배분, 수익 인식의 5단계로 인식한다.','거래가격에는 제3자를 대신해서 회수한 금액(예: 부가가치세)은 포함하지 않는다.','변동대가는 기댓값 또는 가능성이 가장 높은 금액 중 받을 권리를 갖게 될 대가를 더 잘 예측하는 방법으로 추정한다.','가능한 결과치가 두 가지뿐인 계약에서는 기댓값이 변동대가의 적절한 추정치가 될 수 있다.','거래가격은 상대적 개별 판매가격을 기준으로 각 수행의무에 배분한다.'],a:3,e:'가능한 결과치가 두 가지뿐인 경우(예: 성과보너스를 받거나 못 받는 경우)에는 가능성이 가장 높은 금액이 적절한 추정치가 될 수 있다.'},
{p:'재무회계',t:'수익',q:'수익 인식 시기에 관한 설명으로 옳지 않은 것은?',o:['고객이 기업의 수행에서 제공하는 효익을 기업이 수행하는 대로 동시에 얻고 소비하면 기간에 걸쳐 수익을 인식한다.','기업이 수행하여 만들거나 가치가 높아지는 자산을 고객이 통제하면 기간에 걸쳐 수익을 인식한다.','기업이 만든 자산이 기업에 대체 용도가 없고 지금까지 수행을 완료한 부분에 대해 집행 가능한 지급청구권이 있으면 기간에 걸쳐 수익을 인식한다.','기업이 만든 자산이 기업에 대체 용도가 있다면 지급청구권이 없더라도 기간에 걸쳐 수익을 인식한다.','진행률을 합리적으로 측정할 수 없지만 발생원가는 회수될 것으로 예상되면 발생원가 범위에서만 수익을 인식한다.'],a:3,e:'기간에 걸쳐 수익을 인식하려면 대체 용도가 없고, 지금까지 수행을 완료한 부분에 대한 집행 가능한 지급청구권이 있어야 한다.'},

{p:'재무회계',t:'수익',q:'수익 인식의 특수한 거래에 관한 설명으로 옳지 않은 것은?',o:['고객이 대가를 선급하였고 재화 이전 시점이 고객의 재량에 따라 결정되면 유의적인 금융요소가 없다.','기업이 원래 판매가격 이상의 금액으로 자산을 다시 사야 하는 선도계약은 금융약정으로 회계처리한다.','위탁판매의 경우 위탁자는 수탁자가 제3자에게 판매하기 전에는 수익을 인식하지 않는다.','반품권이 있는 판매에서 반품이 예상되는 부분은 수익으로 인식하지 않고 환불부채로 인식한다.','고객에게 지급할 대가는 고객에게서 받는 구별되는 재화의 대가가 아니더라도 판매비용으로 처리한다.'],a:4,e:'고객에게 지급할 대가는 구별되는 재화나 용역의 대가가 아니라면 거래가격(수익)에서 차감한다.'},
{p:'재무회계',t:'리스',q:'리스이용자의 회계처리에 관한 설명으로 옳지 않은 것은?',o:['리스이용자는 단기리스와 소액 기초자산 리스에 대해 인식 면제를 선택할 수 있다.','리스부채는 지급되지 않은 리스료를 내재이자율로 할인한 현재가치로 측정하며, 내재이자율을 쉽게 산정할 수 없으면 증분차입이자율을 사용한다.','사용권자산의 원가에는 리스부채의 최초 측정금액, 리스개설직접원가, 복구원가 추정치가 포함된다.','리스의 분류는 리스개시일을 기준으로 결정한다.','소유권이 이전되지 않는 리스의 사용권자산은 리스기간과 내용연수 중 짧은 기간에 걸쳐 감가상각한다.'],a:3,e:'리스는 리스개시일이 아니라 리스약정일에 분류한다.'},
{p:'재무회계',t:'리스',q:'리스제공자가 금융리스로 분류하는 일반적인 상황에 해당하지 않는 것은?',o:['리스기간 종료시점 이전에 기초자산의 소유권이 리스이용자에게 이전된다.','리스이용자가 매수선택권을 행사할 것이 리스약정일 현재 상당히 확실하다.','리스기간이 기초자산의 경제적 내용연수의 상당 부분을 차지한다.','리스약정일 현재 리스료의 현재가치가 적어도 기초자산 공정가치의 대부분에 해당한다.','잔존자산의 공정가치 변동에 따른 손익이 리스제공자에게 귀속된다.'],a:4,e:'잔존자산의 공정가치 변동에 따른 손익이 리스이용자에게 귀속되는 경우가 금융리스로 분류될 수 있는 상황이다.'},
{p:'재무회계',t:'종업원급여',q:'퇴직급여제도에 관한 설명으로 옳지 않은 것은?',o:['확정기여제도에서 기업의 법적의무나 의제의무는 기업이 기여하기로 약정한 금액으로 한정된다.','확정기여제도에서는 보험수리적위험과 투자위험을 종업원이 부담한다.','확정급여제도의 재측정요소는 기타포괄손익으로 인식하고 후속 기간에 당기손익으로 재분류하지 않는다.','확정급여채무의 현재가치는 예측단위적립방식으로 측정한다.','순확정급여부채의 순이자에 포함되는 사외적립자산의 이자수익은 사외적립자산의 실제수익으로 계산한다.'],a:4,e:'사외적립자산의 이자수익은 실제수익이 아니라 사외적립자산에 할인율을 곱하여 계산하며, 실제수익과의 차이는 재측정요소이다.'},
{p:'재무회계',t:'법인세',q:'법인세회계에 관한 설명으로 옳지 않은 것은?',o:['이연법인세자산과 이연법인세부채는 현재가치로 할인하지 않는다.','미사용 세무상결손금은 미래 과세소득의 발생 가능성이 높은 범위 안에서 이연법인세자산으로 인식한다.','이연법인세는 관련 자산이 실현되거나 부채가 결제될 회계기간에 적용될 것으로 기대되는 세율로 측정한다.','자본에 직접 인식하는 항목과 관련된 법인세는 자본에 직접 반영한다.','이연법인세자산과 이연법인세부채는 유동항목으로 분류한다.'],a:4,e:'유동·비유동 구분 표시를 하는 경우 이연법인세자산(부채)은 유동항목으로 분류하지 않는다.'},
{p:'재무회계',t:'회계변경·오류',q:'회계정책과 회계추정치의 변경에 관한 설명으로 옳지 않은 것은?',o:['회계정책의 변경은 원칙적으로 소급적용한다.','회계추정치 변경의 효과는 전진적으로 인식한다.','측정기준의 변경은 회계정책의 변경에 해당한다.','회계정책의 변경과 회계추정치의 변경을 구분하기 어려우면 회계추정치의 변경으로 본다.','감가상각방법의 변경은 회계정책의 변경으로 처리한다.'],a:4,e:'감가상각방법, 내용연수, 잔존가치의 변경은 회계추정치의 변경으로 처리한다.'},
{p:'재무회계',t:'회계변경·오류',q:'전기오류에 관한 설명으로 옳지 않은 것은?',o:['중요한 전기오류는 발견된 기간의 당기손익으로 보고한다.','중요한 전기오류는 원칙적으로 비교 표시되는 과거기간의 금액을 재작성하여 소급수정한다.','과거기간 전체에 대한 오류의 누적효과를 실무적으로 결정할 수 없으면 실무적으로 적용할 수 있는 가장 이른 날부터 전진적으로 오류를 수정하여 비교정보를 재작성한다.','기말재고자산 과대계상 오류는 다른 오류가 없다면 다음 연도 말에 이익잉여금에 대한 영향이 자동으로 상쇄된다.','새로운 정보로 인한 회계추정치의 변경은 오류수정이 아니다.'],a:0,e:'중요한 전기오류는 발견된 기간의 당기손익으로 보고하지 않고 소급재작성으로 수정한다.'},
{p:'재무회계',t:'현금흐름표',q:'현금흐름표에 관한 설명으로 옳지 않은 것은?',o:['간접법은 당기순이익에 현금 유출입이 없는 손익과 영업활동 관련 자산·부채의 변동을 조정하여 영업활동현금흐름을 표시한다.','현금성자산에는 취득일로부터 만기가 3개월 이내인 채무상품이 포함될 수 있다.','법인세로 인한 현금흐름은 별도로 공시하며, 재무활동과 투자활동에 명백히 관련되지 않으면 영업활동으로 분류한다.','단기매매목적으로 보유하는 유가증권의 취득과 판매에 따른 현금흐름은 영업활동으로 분류한다.','유형자산의 처분에 따른 현금유입은 영업활동현금흐름으로 분류한다.'],a:4,e:'유형자산의 취득·처분에 따른 현금흐름은 투자활동현금흐름이다.'},
{p:'재무회계',t:'관계기업',q:'관계기업투자에 관한 설명으로 옳지 않은 것은?',o:['직접 또는 간접으로 피투자자 의결권의 20% 이상을 보유하면 반증이 없는 한 유의적인 영향력이 있는 것으로 본다.','관계기업에서 받은 배당금은 투자자산의 장부금액을 줄인다.','관계기업의 기타포괄손익 중 투자자의 지분은 투자자의 기타포괄손익으로 인식한다.','투자자와 관계기업 사이의 상향·하향 거래에서 생긴 미실현손익은 투자자의 지분만큼 제거한다.','취득 시 피투자자 순자산 공정가치 중 투자자 지분이 투자원가를 초과하는 금액은 영업권으로 인식한다.'],a:4,e:'순자산 공정가치 지분이 투자원가를 초과하는 금액(염가매수차익)은 취득한 기간의 지분법손익에 포함하여 수익으로 인식한다.'},
{p:'재무회계',t:'외화환산',q:'기능통화에 의한 외화거래의 보고에 관한 설명으로 옳지 않은 것은?',o:['외화거래를 최초로 인식하는 경우 거래일의 현물환율을 적용한다.','매 보고기간 말 화폐성 외화항목은 마감환율로 환산한다.','역사적원가로 측정하는 비화폐성 외화항목은 거래일의 환율로 환산한다.','공정가치로 측정하는 비화폐성 외화항목은 공정가치가 측정된 날의 환율로 환산한다.','화폐성 항목의 결제나 환산에서 생기는 외환차이는 기타포괄손익으로 인식한다.'],a:4,e:'화폐성 항목의 외환차이는 발생하는 회계기간의 당기손익으로 인식한다.'},
{p:'재무회계',t:'보고기간후사건',q:'보고기간후사건에 관한 설명으로 옳지 않은 것은?',o:['보고기간 말에 존재하였던 상황에 대해 증거를 제공하는 사건은 수정을 요하는 보고기간후사건이다.','보고기간 후에 소송사건이 확정되어 보고기간 말에 현재의무가 있었음이 확인되면 재무제표를 수정한다.','보고기간 말과 발행승인일 사이에 투자자산의 공정가치가 하락한 것은 수정을 요하지 않는 사건이다.','보고기간 후 매출처의 파산으로 보고기간 말 매출채권에 손상이 발생했음이 확인되면 수정을 요하는 사건이다.','보고기간 후 계속기업의 가정이 더 이상 적절하지 않다고 판단되더라도 보고기간 말 상황에 근거하여 계속기업 기준으로 재무제표를 작성한다.'],a:4,e:'보고기간 후에 경영진이 청산하거나 중단할 의도가 있다고 판단하면 계속기업의 기준에 따라 재무제표를 작성해서는 안 된다.'},
{p:'재무회계',t:'주식기준보상',q:'주식기준보상에 관한 설명으로 옳지 않은 것은?',o:['주식결제형 주식기준보상은 부여일의 지분상품 공정가치로 측정하고 이후 재측정하지 않는다.','현금결제형 주식기준보상은 부채가 결제될 때까지 매 보고기간 말과 결제일에 부채의 공정가치를 재측정한다.','시장조건인 가득조건은 지분상품의 공정가치를 추정할 때 고려한다.','시장조건이 아닌 가득조건은 가득될 것으로 예상되는 지분상품의 수량을 추정할 때 고려한다.','주식결제형 주식선택권이 가득된 뒤 행사되지 않고 소멸하면 이미 인식한 보상원가를 환입한다.'],a:4,e:'가득된 주식선택권이 행사되지 않고 소멸하더라도 이미 인식한 보상원가는 환입하지 않는다(자본 항목 간 대체는 가능).'},
{p:'원가관리회계',t:'원가의 개념',q:'원가의 개념에 관한 설명으로 옳지 않은 것은?',o:['기회원가는 선택되지 않은 대안 중 최대의 효익을 말한다.','매몰원가는 이미 발생하여 회수할 수 없는 원가로 의사결정과 무관하다.','관련범위 내에서 고정원가 총액은 일정하고 단위당 고정원가는 생산량이 증가하면 감소한다.','기본원가(기초원가)는 직접재료원가와 직접노무원가의 합이다.','가공원가(전환원가)는 직접재료원가와 제조간접원가의 합이다.'],a:4,e:'가공원가(전환원가)는 직접노무원가와 제조간접원가의 합이다.'},
{p:'원가관리회계',t:'개별·종합원가',q:'개별원가계산과 종합원가계산에 관한 설명으로 옳지 않은 것은?',o:['개별원가계산은 다품종 소량의 주문생산에 적합하다.','종합원가계산은 동종 제품을 연속적으로 대량생산하는 경우에 적합하다.','선입선출법은 기초재공품 원가를 모두 완성품원가에 포함한다.','가중평균법은 기초재공품 원가와 당기발생원가를 구분하지 않고 합하여 환산량 단위당 원가를 계산한다.','기초재공품이 없더라도 선입선출법과 가중평균법의 완성품환산량은 서로 다르다.'],a:4,e:'기초재공품이 없으면 두 방법의 완성품환산량과 완성품원가는 같다.'},
{p:'원가관리회계',t:'활동기준원가',q:'활동기준원가계산에 관한 설명으로 옳지 않은 것은?',o:['제조간접원가의 비중이 크고 제품이 다양할수록 유용하다.','활동분석으로 비부가가치 활동을 파악하여 원가절감에 활용할 수 있다.','묶음(배치)수준 활동원가는 묶음 수에 비례하여 발생한다.','설비유지수준 활동원가는 생산량과 관계없이 발생한다.','묶음 크기를 줄이면 묶음수준 활동원가가 절감된다.'],a:4,e:'묶음수준 활동원가를 줄이려면 묶음 수를 줄여야 한다. 묶음 크기를 줄이면 묶음 수가 늘어 원가가 증가한다.'},
{p:'원가관리회계',t:'변동·전부원가',q:'전부원가계산과 변동원가계산에 관한 설명으로 옳지 않은 것은?',o:['변동원가계산은 고정제조간접원가를 발생한 기간의 비용으로 처리한다.','생산량이 판매량보다 많으면 전부원가계산의 영업이익이 변동원가계산의 영업이익보다 크다.','판매가격과 원가구조가 일정하면 변동원가계산의 영업이익은 판매량에 의해서만 영향을 받는다.','외부보고 목적으로는 전부원가계산을 사용한다.','전부원가계산은 변동원가계산보다 경영자의 과잉생산을 더 잘 억제한다.'],a:4,e:'전부원가계산에서는 생산량을 늘리면 고정제조간접원가가 재고로 이연되어 이익이 커지므로 오히려 과잉생산을 유도할 수 있다.'},
{p:'원가관리회계',t:'표준원가',q:'표준원가계산에 관한 설명으로 옳지 않은 것은?',o:['표준원가는 예산편성과 원가통제에 유용하다.','직접재료 가격차이를 구입시점에 분리하면 원재료 계정은 표준원가로 기록된다.','고정제조간접원가 조업도차이는 실제생산량에 허용된 표준조업도와 기준조업도의 차이 때문에 발생한다.','불리한 직접재료 수량차이는 언제나 생산부문의 책임이다.','변동제조간접원가 능률차이는 실제조업도와 표준조업도의 차이에서 발생한다.'],a:3,e:'품질이 낮은 재료를 싸게 구입하여 사용량이 늘어난 경우처럼 불리한 수량차이가 구매부문의 책임일 수도 있다.'},
{p:'원가관리회계',t:'의사결정',q:'단기 의사결정에 관한 설명으로 옳지 않은 것은? (단, 다른 조건은 일정하다.)',o:['유휴생산능력이 있으면 특별주문 가격이 단위당 증분원가를 초과할 때 수락하면 이익이 증가한다.','자가제조와 외부구입을 비교할 때 회피할 수 없는 고정원가는 비관련원가이다.','제한된 자원이 하나뿐이면 제한자원 단위당 공헌이익이 큰 제품부터 생산한다.','제품라인을 폐지하면 그 제품에 배부된 공통고정원가도 함께 절감된다.','기회원가는 의사결정에 관련된 원가이다.'],a:3,e:'공통고정원가는 제품라인을 폐지하더라도 회피되지 않는 경우가 일반적이므로 다른 제품이 부담하게 된다.'},
{p:'원가관리회계',t:'원가추정·CVP',q:'원가-조업도-이익(CVP) 분석에 관한 설명으로 옳지 않은 것은?',o:['공헌이익률은 1에서 변동비율을 뺀 값이다.','안전한계율은 영업레버리지도의 역수이다.','다른 조건이 같다면 고정원가의 비중이 클수록 영업레버리지도가 크다.','법인세율이 높아지면 손익분기점 판매량이 증가한다.','복수 제품의 경우 매출배합이 변하면 손익분기점도 변한다.'],a:3,e:'손익분기점에서는 이익이 0이므로 법인세가 없다. 법인세율은 손익분기점에 영향을 주지 않는다.'},
{p:'원가관리회계',t:'최신 관리회계',q:'최신 관리회계 기법에 관한 설명으로 옳지 않은 것은?',o:['목표원가는 목표가격에서 목표이익을 차감하여 결정한다.','카이젠원가계산은 제조단계에서의 지속적인 원가절감에 초점을 맞춘다.','균형성과표의 학습과 성장 관점은 종업원 역량과 정보시스템 등을 다룬다.','예방원가와 평가원가를 늘리면 일반적으로 실패원가는 줄어든다.','제품수명주기원가계산은 제조이전단계보다 제조단계에서 원가절감 여지가 더 크다고 본다.'],a:4,e:'제품수명주기원가계산은 대부분의 원가가 연구개발·설계 등 제조이전단계에서 결정된다고 보아 그 단계의 원가관리를 강조한다.'},
{p:'원가관리회계',t:'예산·성과평가',q:'예산과 책임회계에 관한 설명으로 옳지 않은 것은?',o:['종합예산은 판매예산에서 출발하여 편성한다.','변동예산은 실제 조업도에 맞추어 수정한 예산이다.','고정예산과 실제 결과의 차이는 매출조업도차이와 변동예산차이로 나눌 수 있다.','투자중심점은 수익과 원가뿐 아니라 투자액에 대해서도 책임을 진다.','투자수익률(ROI)로 평가하면 사업부는 최저필수수익률을 넘는 투자안을 항상 채택하게 된다.'],a:4,e:'투자수익률로 평가하면 회사의 최저필수수익률보다 수익률이 높더라도 사업부의 현재 ROI보다 낮은 투자안을 거부하는 준최적화가 생길 수 있다.'}
];
if(typeof module!=='undefined')module.exports={CONCEPT};

</script>
<script>
{
const KEY='acc-daily20-v1',NC=4,NF=11,NK=5,NUMS='①②③④⑤',app=document.getElementById('app');
const ymd=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const today=()=>ymd(new Date()),yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)};
const def=()=>({xp:0,streak:0,last:'',sets:{},gw:{},gs:{},gc:{},cw:{},cs:{},nseed:0});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'null')||{})}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
if(S.last&&S.last!==today()&&S.last!==yest())S.streak=0;
const esc=t=>String(t??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]);
const ic=id=>`<svg class="ico"><use href="#i-${id}"/></svg>`;
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const GB={};GENS.forEach(g=>GB[g.id]=g);
let cur=null;

function wpick(R,arr,n,w){const a=arr.slice(),out=[];while(out.length<n&&a.length){const ws=a.map(w),t=ws.reduce((x,y)=>x+y,0);let r=R.f()*t,i=0;while(r>ws[i]&&i<a.length-1){r-=ws[i];i++}out.push(a.splice(i,1)[0])}return out}
function makeSet(key,mode){
  const R=mkR(hash(key));
  const wg=g=>Math.max(.4,1+2*(S.gw[g.id]||0)-.25*(S.gs[g.id]||0)+(mode==='weak'?4*(S.gw[g.id]||0):0));
  const fin=wpick(R,GENS.filter(g=>g.p==='재무회계'),NF,wg),cost=wpick(R,GENS.filter(g=>g.p==='원가관리회계'),NK,wg);
  const wc=i=>Math.max(.3,1+2*(S.cw[i]||0)-.5*(S.cs[i]||0)+(mode==='weak'?4*(S.cw[i]||0):0));
  const cs=wpick(R,CONCEPT.map((_,i)=>i),NC,wc);
  const items=[...fin,...cost].map(g=>({k:'g',g:g.id,s:R.int(1,2e9)}));
  const con=cs.map(i=>({k:'c',i,ord:R.shuf([0,1,2,3,4])}));
  const all=R.shuf(items);[4,9,14,19].forEach((p,j)=>all.splice(p,0,con[j]));
  return{key,mode,items:all.slice(0,20),ans:{},t0:0,done:false,score:0}
}
function build(it){
  if(it.k==='g'){const q=makeQ(GB[it.g],it.s);return q}
  const c=CONCEPT[it.i];const o=it.ord.map(k=>c.o[k]);return{kind:'concept',p:c.p,t:c.t,s:{q:c.q},o,a:it.ord.indexOf(c.a),e:[c.e]}
}
function setKey(n){return today()+'#'+n}
function todaySets(){return Object.keys(S.sets).filter(k=>k.startsWith(today()+'#')).map(k=>S.sets[k])}
function ensureToday(){if(!S.sets[setKey(1)]){S.sets[setKey(1)]=makeSet(setKey(1),'normal');save()}return S.sets[setKey(1)]}
function statsBar(){const td=todaySets().reduce((s,x)=>s+Object.keys(x.ans).length,0);
  return `<div class="stats"><div class="wrap"><span class="stat fire" title="연속 학습일">${ic('fire')}${S.streak}일</span><span class="stat xp" title="총 XP">${ic('bolt')}${S.xp} XP</span><span class="stat goal" title="오늘 푼 문제">${ic('target')}오늘 ${td}문제</span></div></div>`}
function cellsHTML(set,qs){return `<div class="cells" aria-label="문항별 결과">${set.items.map((it,i)=>{const a=set.ans[i];const cls=a==null?'':a.ok?'ok':'ng';return `<span class="cell ${cls} ${it.k==='c'?'c':''}" title="${i+1}번 ${it.k==='c'?'말문제':'계산문제'}">${i+1}</span>`}).join('')}</div>`}
function home(){
  cur=null;const set=ensureToday();const sets=todaySets().sort((a,b)=>a.key.localeCompare(b.key));
  const active=sets.find(s=>!s.done),last=sets[sets.length-1];const show=active||last;const n=Object.keys(show.ans).length;
  const hist=[];for(let k=6;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);const key=ymd(d);const ss=Object.values(S.sets).filter(s=>s.key.startsWith(key+'#')&&s.done);const best=ss.length?Math.max(...ss.map(s=>s.score)):null;hist.push({lab:k?(d.getMonth()+1)+'/'+d.getDate():'오늘',v:best})}
  const tp={};Object.values(S.sets).forEach(st=>st.items.forEach((it,i)=>{const a=st.ans[i];if(!a)return;const t=it.k==='g'?GB[it.g].t:CONCEPT[it.i].t;tp[t]=tp[t]||[0,0];tp[t][1]++;if(a.ok)tp[t][0]++}));
  const weak=Object.entries(tp).filter(([,v])=>v[1]>=2).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).slice(0,5);
  const anyWrong=Object.values(S.gw).some(v=>v>0)||Object.values(S.cw).some(v=>v>0);
  app.innerHTML=statsBar()+`<div class="wrap">
  <div class="hero"><h1>회계학 데일리 20</h1><p>매일 계산문제 16개, 말문제 4개. 계산문제는 기출 유형에 숫자를 새로 넣어 매번 다르게 나와요.</p></div>
  <section class="today">
    <div class="top"><h2>${show===sets[0]?'오늘의 20문제':'추가 세트 '+(sets.indexOf(show))}${show.mode==='weak'?' · 약점':''}</h2><span class="date">${today().replace(/-/g,'. ')}</span></div>
    ${cellsHTML(show)}
    <p class="mix">${show.done?`점수 ${show.score} / 20 · 노란 테두리는 말문제예요`:`${n} / 20 진행 · 재무회계 계산 ${NF} · 원가관리회계 계산 ${NK} · 말문제 ${NC}`}</p>
    ${show.done?`<button class="go" id="again">추가 세트 풀기</button><div class="row2"><button class="go ghost" id="review">결과 다시 보기</button><button class="go ghost" id="weakset" ${anyWrong?'':'disabled'}>약점 세트</button></div>`
      :`<button class="go" id="start">${n?'이어서 풀기':'시작하기'}</button>`}
  </section>
  <section class="sec"><h3>최근 7일 최고 점수</h3><div class="week">${hist.map(h=>`<div class="wk"><b>${h.v==null?'':h.v}</b><i style="height:${h.v==null?3:Math.max(6,h.v/20*100)}%;${h.v==null?'background:var(--line)':''}"></i>${h.lab}</div>`).join('')}</div></section>
  ${weak.length?`<section class="sec weak"><h3>정답률이 낮은 유형</h3><ul>${weak.map(([t,v])=>`<li><span>${esc(t)}</span><span class="pc">${Math.round(v[0]/v[1]*100)}% (${v[0]}/${v[1]})</span></li>`).join('')}</ul><p class="mix" style="margin-top:8px">틀린 유형은 다음 세트에 더 자주 나와요.</p></section>`:''}
  <p class="note">계산문제는 출제 유형별 생성기로 만들어 정답과 함정 보기를 직접 계산해요. 계산 ${GENS.length}개 유형 · 말문제 ${CONCEPT.length}문항.</p>
  <button class="reset" id="rs">기록 초기화</button></div>`;
  const b=id=>app.querySelector('#'+id);
  if(b('start'))b('start').onclick=()=>run(show);
  if(b('again'))b('again').onclick=()=>{const k=setKey(sets.length+1);S.sets[k]=makeSet(k,'normal');save();run(S.sets[k])};
  if(b('weakset'))b('weakset').onclick=()=>{const k=setKey(sets.length+1);S.sets[k]=makeSet(k,'weak');save();run(S.sets[k])};
  if(b('review'))b('review').onclick=()=>finish(show);
  b('rs').onclick=e=>{if(e.target.dataset.c){localStorage.removeItem(KEY);S=def();save();home()}else{e.target.dataset.c=1;e.target.textContent='한 번 더 누르면 모든 기록이 지워져요'}};
  window.scrollTo(0,0);
}
function run(set){
  if(!set.t0)set.t0=Date.now();
  const qs=set.items.map(build);const first=set.items.findIndex((_,i)=>!set.ans[i]);
  cur={set,qs,pos:first<0?0:first,sel:null,checked:false};render();
}
function stemHTML(q){const s=q.s;let h='';
  if(s.intro)h+=`<p>${esc(s.intro)}</p>`;
  if(s.table)h+=`<div class="tbl"><table><thead><tr>${s.table.h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${s.table.r.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(s.lines&&s.lines.length)h+=`<ul>${s.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;
  h+=`<p class="qq">${esc(s.q)}</p>`;return h}
function render(){
  const {set,qs,pos}=cur,q=qs[pos];cur.sel=null;cur.checked=false;const done=Object.keys(set.ans).length;
  app.innerHTML=`<div class="wrap"><div class="ltop"><button class="x" id="quit" aria-label="그만하고 홈으로">${ic('x')}</button>
    <div class="bar" role="progressbar" aria-label="진행" aria-valuenow="${done}" aria-valuemax="20"><i style="width:${done/20*100}%"></i></div><span class="cnt">${pos+1} / 20</span></div>
    <div class="qbody" id="qb"><span class="tag ${q.kind==='concept'?'c':''}">${q.kind==='concept'?'말문제':'계산문제'}</span><span class="tag">${esc(q.p)} · ${esc(q.t)}</span>
    <div class="paper">${stemHTML(q)}</div>
    <div class="chips">${q.o.map((o,k)=>`<button class="chip ${q.kind==='calc'?'num':''}" data-v="${k}"><kbd>${NUMS[k]}</kbd><span>${esc(o)}</span></button>`).join('')}</div></div></div>
    <div class="foot" id="ft"><div class="wrap"><div class="res" id="res" aria-live="polite"></div><button class="go" id="go" disabled>확인</button></div></div>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>choose(b));
  app.querySelector('#go').onclick=act;app.querySelector('#quit').onclick=home;window.scrollTo(0,0);
}
function choose(b){if(cur.checked||!b)return;app.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===b));cur.sel=+b.dataset.v;document.getElementById('go').disabled=false}
function act(){if(!cur.checked){if(cur.sel!=null)check()}else next()}
function check(){
  const {set,qs,pos}=cur,q=qs[pos],it=set.items[pos];cur.checked=true;const ok=cur.sel===q.a;
  set.ans[pos]={c:cur.sel,ok};
  if(it.k==='g'){S.gs[it.g]=(S.gs[it.g]||0)+1;if(!ok)S.gw[it.g]=(S.gw[it.g]||0)+1;else if(S.gw[it.g])S.gw[it.g]=Math.max(0,S.gw[it.g]-.5)}
  else{S.cs[it.i]=(S.cs[it.i]||0)+1;if(!ok)S.cw[it.i]=(S.cw[it.i]||0)+1;else if(S.cw[it.i])S.cw[it.i]=Math.max(0,S.cw[it.i]-.5)}
  if(ok)S.xp+=q.kind==='calc'?3:2;
  if(S.last!==today()){S.streak=(S.last===yest()?S.streak:0)+1;S.last=today()}
  save();
  app.querySelectorAll('.chip').forEach(c=>{const v=+c.dataset.v;if(v===q.a)c.classList.add('right');else if(v===cur.sel)c.classList.add('wrong')});
  const ft=document.getElementById('ft'),res=document.getElementById('res'),go=document.getElementById('go');
  res.innerHTML=`<h3>${ic(ok?'check':'no')}${ok?['정답!','훌륭해요!','바로 그거예요!'][Math.random()*3|0]:'아쉬워요'}</h3>${ok?'':`<p class="ans">정답: ${NUMS[q.a]} ${esc(q.o[q.a])}</p>`}<ol>${q.e.map(l=>`<li>${esc(l)}</li>`).join('')}</ol>`;
  ft.className='foot '+(ok?'ok':'bad');if(!ok)document.getElementById('qb').classList.add('shake');
  go.textContent=Object.keys(set.ans).length>=20?'결과 보기':'계속';go.focus();
}
function next(){const {set}=cur;const nx=set.items.findIndex((_,i)=>!set.ans[i]);if(nx<0){set.done=true;set.score=Object.values(set.ans).filter(a=>a.ok).length;S.xp+=set.score===20?20:0;save();finish(set);return}cur.pos=nx;render()}
function finish(set){
  const qs=set.items.map(build);const sc=set.score,sec=set.t0?Math.round((Date.now()-set.t0)/1000):0;
  const cal=set.items.map((it,i)=>[it,i]).filter(([it])=>it.k==='g'),con=set.items.map((it,i)=>[it,i]).filter(([it])=>it.k==='c');
  const okc=a=>a.filter(([,i])=>set.ans[i]&&set.ans[i].ok).length;
  app.innerHTML=statsBar()+`<div class="wrap end"><div class="big">${sc}<small> / 20</small></div><h1>${sc>=18?'훌륭해요!':sc>=14?'합격권이에요':sc>=10?'조금만 더!':'복습이 필요해요'}</h1><p>${set.key.replace('#',' · 세트 ')}</p>
  <div class="boxes"><div class="box" style="--c:var(--pri)"><div>계산문제</div><b>${okc(cal)} / ${cal.length}</b></div><div class="box" style="--c:#b45309"><div>말문제</div><b>${okc(con)} / ${con.length}</b></div><div class="box" style="--c:var(--gold)"><div>걸린 시간</div><b>${sec>5400?'—':Math.floor(sec/60)+'분'}</b></div></div>
  <div class="rev">${qs.map((q,i)=>{const a=set.ans[i];const ok=a&&a.ok;return `<details ${ok?'':'open'}><summary><span class="mk ${ok?'o':''}">${i+1}</span>${esc(q.t)} · ${ok?'정답':'오답'}</summary><div class="body"><div class="paper">${stemHTML(q)}</div><p><b>정답</b> ${NUMS[q.a]} ${esc(q.o[q.a])}${a&&!ok?` · <span style="color:var(--badD)">내 답 ${NUMS[a.c]} ${esc(q.o[a.c])}</span>`:''}</p><ol>${q.e.map(l=>`<li>${esc(l)}</li>`).join('')}</ol></div></details>`}).join('')}</div>
  <button class="go" id="home">홈으로</button></div>`;
  app.querySelector('#home').onclick=home;window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{if(!cur||!document.getElementById('go')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter'){e.preventDefault();act();return}if(cur.checked)return;const n=parseInt(e.key,10);const bs=[...app.querySelectorAll('.chip')];if(n>=1&&n<=bs.length)choose(bs[n-1])});
home();
}
</script>
</body>
</html>
